<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haru English · Destination B1</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e4e0d6;--acc:#2f6f5e;--acc2:#e7f1ee;--bad:#b3261e;--bad2:#fbeceb;--ok:#1f7a4d;--ok2:#e6f4ec}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8eaee;--mute:#9aa3b2;--line:#2c323c;--acc:#7cc4ae;--acc2:#1f2f2b;--bad:#f2867d;--bad2:#3a2222;--ok:#79d3a2;--ok2:#1d3327}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:18px;margin:22px 0 8px}h3{font-size:16px;margin:0 0 4px}
.mute{color:var(--mute);font-size:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
a{color:var(--acc)}button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.unit{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:56px}
.unit b{display:block}.pill{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px;display:block;overflow-x:auto}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
code{background:var(--acc2);color:var(--acc);padding:1px 5px;border-radius:5px;font-size:.94em}s{color:var(--bad)}
.ex{border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0}.ex small{display:block;color:var(--mute)}
.note{background:var(--bad2);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14.5px}.tip{background:var(--acc2);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14.5px}
details{border-top:1px solid var(--line);padding:8px 0}details:first-of-type{border-top:0}summary{cursor:pointer;font-weight:600;min-height:32px}
.word{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:9px 0}.word:first-child{border-top:0}
.say{background:transparent;border:1px solid var(--line);border-radius:8px;min-width:40px;min-height:40px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;min-height:46px}
.opt.ok{background:var(--ok2);border-color:var(--ok)}.opt.bad{background:var(--bad2);border-color:var(--bad)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:42px}.tile.used{opacity:.3}
.line{min-height:52px;border:1px dashed var(--line);border-radius:10px;padding:8px;margin:10px 0}
input[type=text],textarea{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px}
.q{font-size:18px;margin:6px 0 10px}.fb{border-radius:10px;padding:10px 12px;margin:10px 0}.fb.ok{background:var(--ok2)}.fb.bad{background:var(--bad2)}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
.timer{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700}
</style>
</head>
<body><main id="app"></main>
<script>
const D={"lessons":[{"n":1,"t":"Unit 1 · Hiện tại đơn, hiện tại tiếp diễn, động từ trạng thái","en":"Present simple, present continuous, stative verbs","notes":[["Mục tiêu của bài","• 🎯 Nói và viết đúng về thói quen, sự thật và việc đang diễn ra; không chia tiếp diễn với động từ trạng thái.\n• 📖 Trong sách: Unit ngữ pháp 1, trang 6–8. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Speaking Part 1 hỏi về thói quen và sở thích: gần như mọi câu trả lời bắt đầu bằng hiện tại đơn. Writing Task 2 dùng hiện tại đơn cho nhận định chung."]],"cards":[{"p":"Present simple: S + V(s/es)","m":"Thói quen, sự thật, tình trạng lâu dài","u":"Dùng cho việc lặp lại (every day, usually), sự thật chung và tình trạng lâu dài.\n| Dạng | Cấu trúc | Ví dụ |\n| Khẳng định | I/you/we/they + V · he/she/it + V-s/es | She works in a bank. |\n| Phủ định | do not / does not + V | He does not work on Sundays. |\n| Nghi vấn | Do / Does + S + V? | Does she work here? |\nTrạng từ tần suất (always, usually, often, sometimes, rarely, never) đứng trước động từ thường, sau `be`.","e":"My sister works for a small company.\nI am often late for class.","ev":"Chị tôi làm cho một công ty nhỏ.\nTôi hay đến lớp muộn.","n":"Lỗi người Việt hay mắc: Tiếng Việt không chia động từ nên rất dễ quên `-s/-es` ở ngôi thứ ba số ít và quên `does` trong câu hỏi: ~~She work~~ → She works; ~~Does she works~~ → Does she work.","tip":"Lỗi thiếu `-s` lặp lại nhiều lần kéo điểm Grammatical Range and Accuracy xuống rõ rệt, cả khi nói lẫn khi viết.","vs":[]},{"p":"Present continuous: am/is/are + V-ing","m":"Việc đang diễn ra hoặc tạm thời","u":"Dùng cho việc đang xảy ra lúc nói (now, at the moment), tình huống tạm thời (this week) và thói quen gây khó chịu với `always`.\nPhủ định: am not / is not / are not + V-ing. Nghi vấn: Am / Is / Are + S + V-ing?","e":"I am studying for my exams this month.\nHe is always losing his keys.","ev":"Tháng này tôi đang ôn thi.\nAnh ấy lúc nào cũng làm mất chìa khóa.","n":"Lỗi người Việt hay mắc: Quên `be`: ~~I studying~~ → I am studying. Dùng tiếp diễn cho thói quen: ~~I am going to school every day~~ → I go to school every day.","tip":null,"vs":[["Present simple: S + V(s/es)","Hiện tại đơn là việc cố định, lặp lại; hiện tại tiếp diễn là việc tạm thời hoặc đang dở dang: I live in Hanoi (lâu dài) / I am living with my aunt this month (tạm thời)."]]},{"p":"Stative verbs (know, like, want, believe…)","m":"Động từ trạng thái không chia tiếp diễn","u":"Động từ chỉ trạng thái (suy nghĩ, cảm xúc, sở hữu, giác quan) thường không dùng ở thì tiếp diễn: be, believe, belong, hate, have (có), know, like, love, need, prefer, seem, think (cho rằng), understand, want.\nMột số động từ có hai nghĩa: think = cho rằng (trạng thái) / đang cân nhắc (hành động); have = có (trạng thái) / ăn, trải qua (hành động).","e":"I know the answer.\nWhat do you think about the plan? I am thinking about it now.","ev":"Tôi biết đáp án.\nBạn nghĩ gì về kế hoạch? Tôi đang cân nhắc đây.","n":"Lỗi người Việt hay mắc: ~~I am knowing~~, ~~I am wanting~~, ~~She is having a car~~ → I know, I want, She has a car.","tip":null,"vs":[]}],"words":[{"h":"usually","m":"thường thường","f":"Từ khóa của bài","e":"I usually have breakfast at seven.","ev":"Tôi thường ăn sáng lúc bảy giờ.","n":null},{"h":"rarely","m":"hiếm khi","f":"Từ khóa của bài","e":"He rarely eats meat.","ev":"Anh ấy hiếm khi ăn thịt.","n":null},{"h":"at the moment","m":"hiện tại, lúc này","f":"Từ khóa của bài","e":"She is working from home at the moment.","ev":"Hiện tại cô ấy làm việc ở nhà.","n":null},{"h":"once a week","m":"một lần mỗi tuần","f":"Từ khóa của bài","e":"I go swimming once a week.","ev":"Tôi đi bơi một lần mỗi tuần.","n":null},{"h":"belong","m":"thuộc về","f":"Từ khóa của bài","e":"This phone belongs to my brother.","ev":"Điện thoại này của em trai tôi.","n":null},{"h":"prefer","m":"thích hơn","f":"Từ khóa của bài","e":"I prefer tea to coffee.","ev":"Tôi thích trà hơn cà phê.","n":null}],"ses":[{"t":"Buổi 1 · Present simple","can":"Sau buổi này bạn dùng được: thói quen, sự thật, tình trạng lâu dài; việc đang diễn ra hoặc tạm thời; động từ trạng thái không chia tiếp diễn.","v":["usually","rarely","at the moment","once a week","belong","prefer"],"g":["Present simple: S + V(s/es)","Present continuous: am/is/are + V-ing","Stative verbs (know, like, want, believe…)"],"c":["B1U01Q1","B1U01Q4","B1U01Q2","B1U01Q5","B1U01Q3","B1U01Q6","B1U01B1","B1U01B2","B1U01B3","B1U01F1","B1U01F2","B1U01D1","B1U01S1"]}],"ex":["B1U01Q1","B1U01Q2","B1U01Q3","B1U01Q4","B1U01Q5","B1U01Q6","B1U01B1","B1U01B2","B1U01B3","B1U01F1","B1U01F2","B1U01D1","B1U01S1"]},{"n":2,"t":"Unit 2 · Quá khứ đơn, quá khứ tiếp diễn, used to","en":"Past simple, past continuous, used to","notes":[["Mục tiêu của bài","• 🎯 Kể lại một chuyện đã xảy ra: việc chính dùng quá khứ đơn, bối cảnh dùng quá khứ tiếp diễn, thói quen cũ dùng used to.\n• 📖 Trong sách: Unit ngữ pháp 2, trang 9–11. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Speaking Part 2 thường yêu cầu kể một trải nghiệm trong quá khứ. Writing Task 1 mô tả số liệu của những năm đã qua bằng quá khứ đơn."]],"cards":[{"p":"Past simple: V-ed / irregular","m":"Việc đã xong ở một thời điểm xác định trong quá khứ","u":"Dùng khi biết hoặc nói rõ thời điểm (yesterday, last year, in 2019, two days ago).\nPhủ định: did not + V. Nghi vấn: Did + S + V?\nĐộng từ bất quy tắc phải học thuộc: go → went, buy → bought, see → saw (bảng ở trang 182–183 của sách).","e":"We moved to Da Nang in 2020.\nDid you see the match last night?","ev":"Chúng tôi chuyển đến Đà Nẵng năm 2020.\nTối qua bạn có xem trận đấu không?","n":"Lỗi người Việt hay mắc: Sau `did` động từ về nguyên mẫu: ~~Did you went~~ → Did you go; ~~I didn't saw~~ → I didn't see. Âm cuối /t/, /d/, /ɪd/ của -ed hay bị nuốt khi nói.","tip":"Khi mô tả biểu đồ có năm trong quá khứ, toàn bộ động từ chính ở quá khứ đơn: The number rose in 2015.","vs":[]},{"p":"Past continuous: was/were + V-ing","m":"Việc đang diễn ra tại một thời điểm trong quá khứ","u":"Dùng để dựng bối cảnh hoặc nói việc đang dở dang thì việc khác xen vào (when + quá khứ đơn, while + quá khứ tiếp diễn).","e":"I was cooking when the phone rang.\nWhile we were waiting, it started to rain.","ev":"Tôi đang nấu ăn thì điện thoại reo.\nTrong lúc chúng tôi chờ, trời bắt đầu mưa.","n":"Lỗi người Việt hay mắc: Hai việc nối tiếp nhau thì cả hai dùng quá khứ đơn, không dùng tiếp diễn: When I got home, I made dinner (về rồi mới nấu).","tip":null,"vs":[["Past simple: V-ed / irregular","Quá khứ đơn là việc trọn vẹn, quá khứ tiếp diễn là việc đang dở: I read the book (đọc xong) / I was reading the book (đang đọc dở)."]]},{"p":"used to + V","m":"Thói quen hoặc tình trạng trong quá khứ, nay không còn","u":"Phủ định: did not use to + V. Nghi vấn: Did + S + use to + V? Chỉ dùng cho quá khứ; hiện tại dùng `usually`.","e":"I used to walk to school, but now I cycle.\nDid you use to live here?","ev":"Trước đây tôi đi bộ đến trường, giờ tôi đạp xe.\nTrước đây bạn sống ở đây à?","n":"Lỗi người Việt hay mắc: Nhầm với `be used to + V-ing` (quen với việc gì): I am used to getting up early = tôi đã quen dậy sớm.","tip":"Rất hợp với Speaking Part 1 và Part 3 khi so sánh xưa và nay: People used to write letters, but now they send messages.","vs":[]}],"words":[{"h":"ago","m":"cách đây (đứng sau khoảng thời gian)","f":"Từ khóa của bài","e":"I started this job two years ago.","ev":"Tôi bắt đầu công việc này cách đây hai năm.","n":null},{"h":"while","m":"trong khi","f":"Từ khóa của bài","e":"While I was studying, my brother was playing games.","ev":"Trong khi tôi học thì em trai tôi chơi game.","n":null},{"h":"suddenly","m":"đột nhiên","f":"Từ khóa của bài","e":"Suddenly the lights went out.","ev":"Đột nhiên đèn tắt.","n":null},{"h":"in those days","m":"hồi đó","f":"Từ khóa của bài","e":"In those days, few people had a car.","ev":"Hồi đó ít người có ô tô.","n":null},{"h":"last","m":"vừa qua, trước (last week, last year)","f":"Từ khóa của bài","e":"I visited Hue last summer.","ev":"Mùa hè năm ngoái tôi đi Huế.","n":null}],"ses":[{"t":"Buổi 1 · Past simple","can":"Sau buổi này bạn dùng được: việc đã xong ở một thời điểm xác định trong quá khứ; việc đang diễn ra tại một thời điểm trong quá khứ; thói quen hoặc tình trạng trong quá khứ, nay không còn.","v":["ago","while","suddenly","in those days","last"],"g":["Past simple: V-ed / irregular","Past continuous: was/were + V-ing","used to + V"],"c":["B1U02Q1","B1U02Q3","B1U02Q2","B1U02Q5","B1U02Q4","B1U02Q6","B1U02B1","B1U02B2","B1U02B3","B1U02F1","B1U02F2","B1U02D1","B1U02S1"]}],"ex":["B1U02Q1","B1U02Q2","B1U02Q3","B1U02Q4","B1U02Q5","B1U02Q6","B1U02B1","B1U02B2","B1U02B3","B1U02F1","B1U02F2","B1U02D1","B1U02S1"]},{"n":3,"t":"Unit 3 · Vui chơi và thể thao","en":"Fun and games","notes":[["Mục tiêu của bài","• 🎯 Nói về sở thích, thể thao và âm nhạc bằng đúng từ và đúng giới từ.\n• 📖 Trong sách: Unit từ vựng 3, trang 12–15. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Speaking Part 1 gần như luôn có chủ đề sở thích, thể thao, âm nhạc. Part 2: Describe a hobby / a sport you enjoy."]],"cards":[],"words":[{"h":"beat","m":"đánh bại, thắng (ai đó)","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"board game","m":"trò chơi trên bàn cờ (cờ tỷ phú, cờ vua…)","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"captain","m":"đội trưởng","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"challenge","m":"(v) thách đấu; (n) thử thách","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"champion","m":"nhà vô địch","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"cheat","m":"gian lận, chơi ăn gian","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"classical music","m":"nhạc cổ điển","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"club","m":"câu lạc bộ","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"coach","m":"huấn luyện viên","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"competition","m":"cuộc thi, giải đấu","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"concert","m":"buổi hòa nhạc","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"defeat","m":"(v) đánh bại; (n) thất bại, trận thua","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"entertaining","m":"thú vị, có tính giải trí","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"folk music","m":"nhạc dân gian","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"group","m":"nhóm nhạc","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"gym","m":"phòng tập thể hình","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"have fun","m":"vui chơi, có khoảng thời gian vui vẻ","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"interest","m":"(v) làm cho ai quan tâm; (n) sở thích, mối quan tâm","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"member","m":"thành viên","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"opponent","m":"đối thủ","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"organise","m":"tổ chức, sắp xếp","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"pleasure","m":"niềm vui thích","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"referee","m":"trọng tài","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"rhythm","m":"nhịp điệu","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"risk","m":"(v) liều, đánh liều; (n) rủi ro, nguy cơ","f":"1 · Topic vocabulary","e" "for / since","m":"for + khoảng thời gian · since + mốc thời gian","u":"`for two years`, `for a long time` (kéo dài bao lâu); `since 2018`, `since Monday`, `since I was a child` (từ lúc nào).","e":"We have known each other for ten years.\nI have not eaten since breakfast.","ev":"Chúng tôi quen nhau mười năm rồi.\nTôi chưa ăn gì từ bữa sáng.","n":"Lỗi người Việt hay mắc: ~~since two years~~ → for two years. Và ~~I live here for five years~~ → I have lived here for five years (vẫn đang sống).","tip":null,"vs":[]},{"p":"Present perfect continuous: have/has been + V-ing","m":"Nhấn vào quá trình kéo dài đến hiện tại","u":"Dùng khi muốn nhấn việc đã kéo dài bao lâu hoặc giải thích một tình trạng hiện tại. Không dùng với động từ trạng thái (know, like).","e":"I have been learning English for three years.\nYour eyes are red. Have you been crying?","ev":"Tôi học tiếng Anh được ba năm rồi.\nMắt bạn đỏ kìa. Bạn vừa khóc à?","n":null,"tip":null,"vs":[["Present perfect simple: have/has + V3","Dạng đơn nhấn kết quả hoặc số lượng (I have read three chapters); dạng tiếp diễn nhấn quá trình (I have been reading all morning)."]]}],"words":[{"h":"already","m":"rồi (xong sớm hơn dự kiến)","f":"Từ khóa của bài","e":"I have already finished my homework.","ev":"Tôi làm xong bài tập rồi.","n":null},{"h":"yet","m":"chưa (trong câu phủ định, câu hỏi)","f":"Từ khóa của bài","e":"Have you eaten yet?","ev":"Bạn ăn chưa?","n":null},{"h":"just","m":"vừa mới","f":"Từ khóa của bài","e":"She has just left.","ev":"Cô ấy vừa đi.","n":null},{"h":"ever","m":"đã từng (trong câu hỏi)","f":"Từ khóa của bài","e":"Have you ever been abroad?","ev":"Bạn đã từng ra nước ngoài chưa?","n":null},{"h":"recently","m":"gần đây","f":"Từ khóa của bài","e":"Prices have risen recently.","ev":"Gần đây giá cả đã tăng.","n":null},{"h":"so far","m":"cho đến nay","f":"Từ khóa của bài","e":"We have had three tests so far.","ev":"Đến nay chúng tôi đã làm ba bài kiểm tra.","n":null}],"ses":[{"t":"Buổi 1 · Present perfect simple" ôi về rồi chị mới nấu) / When I got home, my sister had cooked dinner (tôi về thì đã nấu xong)."]]},{"p":"Past perfect continuous: had been + V-ing","m":"Quá trình kéo dài cho đến một mốc trong quá khứ","u":"Nhấn việc đã kéo dài bao lâu trước một mốc quá khứ, hoặc giải thích một tình trạng trong quá khứ.","e":"She had been waiting for an hour when the bus came.\nThe ground was wet because it had been raining.","ev":"Cô ấy đã chờ một tiếng thì xe buýt mới đến.\nMặt đất ướt vì trước đó trời mưa.","n":null,"tip":null,"vs":[]}],"words":[{"h":"by the time","m":"vào lúc, khi mà (thì việc khác đã xong)","f":"Từ khóa của bài","e":"By the time I woke up, everyone had left.","ev":"Lúc tôi thức dậy thì mọi người đã đi hết.","n":null},{"h":"before","m":"trước khi","f":"Từ khóa của bài","e":"I had finished my work before the meeting started.","ev":"Tôi đã xong việc trước khi cuộc họp bắt đầu.","n":null},{"h":"after","m":"sau khi","f":"Từ khóa của bài","e":"After he had eaten, he went out.","ev":"Sau khi ăn xong, anh ấy ra ngoài.","n":null},{"h":"as soon as","m":"ngay khi","f":"Từ khóa của bài","e":"As soon as she had read the letter, she called me.","ev":"Ngay khi đọc xong thư, cô ấy gọi cho tôi.","n":null},{"h":"earlier","m":"trước đó","f":"Từ khóa của bài","e":"He told me he had met her earlier.","ev":"Anh ấy bảo tôi là đã gặp cô ấy trước đó.","n":null}],"ses":[{"t":"Buổi 1 · Past perfect simple","can":"Sau buổi này bạn dùng được: việc xảy ra trước một việc khác trong quá khứ; quá trình kéo dài cho đến một mốc trong quá khứ.","v":["by the time","before","after","as soon as","earlier"],"g":["Past perfect simple: had + V3","Past perfect continuous: had been + V-ing"],"c":["B1U05Q1","B1U05Q2","B1U05Q4","B1U05Q5","B1U05Q3","B1U05B1","B1U05B2","B1U05B3","B1U05F1","B1U05F2","B1U05D1","B1U05S1"]}],"ex":["B1U05Q1","B1U05Q2","B1U05Q3","B1U05Q4","B1U05Q5","B1U05B1","B1U05B2","B1U05B3","B1U05F1","B1U05F2","B1U05D1","B1U05S1"]},{"n":6,"t":"Unit 6 · Học tập và kỹ năng","en":"Learning and d "f":"2 · Phrasal verbs","e":"She ripped up the letter and threw it away.","ev":"Cô ấy xé vụn lá thư rồi vứt đi.","n":null},{"h":"rub out","m":"tẩy đi","f":"2 · Phrasal verbs","e":"Use a pencil so you can rub out your mistakes.","ev":"Dùng bút chì để tẩy được chỗ sai.","n":null},{"h":"find out","m":"tìm ra, biết được (thông tin)","f":"2 · Phrasal verbs","e":"I want to find out how much the course costs.","ev":"Tôi muốn biết khóa học giá bao nhiêu.","n":null},{"h":"in conclusion","m":"tóm lại, kết luận lại","f":"3 · Prepositional phrases","e":"In conclusion, online learning has both benefits and problems.","ev":"Tóm lại, học trực tuyến có cả lợi ích lẫn vấn đề.","n":null},{"h":"in fact","m":"thực ra","f":"3 · Prepositional phrases","e":"He looks young, but in fact he is fifty.","ev":"Trông anh ấy trẻ nhưng thực ra đã năm mươi.","n":null},{"h":"in favour (of)","m":"ủng hộ","f":"3 · Prepositional phrases","e":"Most students are in favour of the new rule.","ev":"Phần lớn học sinh ủng hộ quy định mới.","n":null},{"h":"in general","m":"nhìn chung","f":"3 · Prepositional phrases","e":"In general, prices are higher in big cities.","ev":"Nhìn chung giá cả ở thành phố lớn cao hơn.","n":null},{"h":"by heart","m":"thuộc lòng","f":"3 · Prepositional phrases","e":"We had to learn the poem by heart.","ev":"Chúng tôi phải học thuộc lòng bài thơ.","n":null},{"h":"for instance","m":"ví dụ như","f":"3 · Prepositional phrases","e":"Some sports, for instance swimming, are good for your back.","ev":"Một số môn thể thao, ví dụ bơi lội, tốt cho lưng.","n":null},{"h":"capable of","m":"có khả năng","f":"4 · Word patterns","e":"She is capable of running her own business.","ev":"Cô ấy đủ khả năng điều hành công việc kinh doanh riêng.","n":null},{"h":"cheat at/in","m":"gian lận trong","f":"4 · Word patterns","e":"He cheated in the final exam.","ev":"Cậu ấy gian lận trong kỳ thi cuối kỳ.","n":null},{"h":"confuse sth with","m":"nhầm cái gì với","f":"4 · Word patterns","e":"People often confuse \"affect\" with \"effect\".","ev":"Mọi người hay nhầm \"affect\" với \"effect\".","n":null},{"h":"cope with","m":"đối phó, xoay xở với","f":"4 · Word patterns","e":"It is hard to cope with so much homework.","ev":"Thật khó xoay xở với ngần ấy bài tập.","n":null},{"h":"learn about","m":"học về, tìm hiểu về","f":"4 · Word patterns","e":"We are learning about climate change.","ev":"Chúng tôi đang học về biến đổi khí hậu.","n":null},{"h":"a question about","m":"câu hỏi về","f":"4 · Word patterns","e":"I have a question about the homework.","ev":"Tôi có một câu hỏi về bài tập.","n":null},{"h":"succeed in","m":"thành công trong việc","f":"4 · Word patterns","e":"She succeeded in finding a good job.","ev":"Cô ấy đã tìm được một công việc tốt.","n":null},{"h":"talented at","m":"có tài về","f":"4 · Word patterns","e":"He is talented at drawing.","ev":"Cậu ấy có năng khiếu vẽ.","n":null},{"h":"ask for","m":"hỏi xin, yêu cầu","f":"4 · Word patterns","e":"She asked for a glass of water.","ev":"Cô ấy xin một cốc nước.","n":null},{"h":"good at","m":"giỏi về","f":"4 · Word patterns","e":"She is good at solving problems.","ev":"Cô ấy giỏi giải quyết vấn đề.","n":null},{"h":"an opinion about/of","m":"ý kiến về","f":"4 · Word patterns","e":"What is your opinion of the new law?","ev":"Ý kiến của bạn về luật mới thế nào?","n":null},{"h":"a solution to","m":"giải pháp cho","f":"4 · Word patterns","e":"There is no easy solution to this problem.","ev":"Không có giải pháp dễ dàng cho vấn đề này.","n":null},{"h":"advice","m":"lời khuyên (không đếm được)","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `advise` (động từ), `adviser` (danh từ chỉ người)"},{"h":"begin","m":"bắt đầu","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `began` (quá khứ đơn), `begun` (quá khứ phân từ), `beginner` (danh từ chỉ người), `beginning` (danh từ)"},{"h":"brave","m":"dũng cảm","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `bravery` (danh từ)"},{"h":"correct","m":"đúng","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `correction` (danh từ), `incorrect` (dạng trái nghĩa)"},{"h":"divide","m":"chia","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `division` (danh từ)"},{"h":"educate","m":"giáo dục","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `education` (danh từ)"},{"h":"except","m":"ngoại trừ","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `exception` (danh từ)"},{"h":"instruct","m":"hướng dẫn","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `instruction` (danh từ), `instructor` (danh từ chỉ người)"},{"h":"intelligent","m":"thông minh","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `intelligence` (danh từ)"},{"h":"memory","m":"trí nhớ; ký ức","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `memorise` (động từ), `memorial` (danh từ)"},{"h":"prepare","m":"chuẩn bị","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `preparation` (danh từ)"},{"h":"refer","m":"nhắc đến, tham chiếu","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `reference` (danh từ)"},{"h":"silent","m":"im lặng","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `silence` (danh từ), `silently` (trạng từ)"},{"h":"simple","m":"đơn giản","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `simplify` (động từ), `simplicity` (danh từ)"}],"ses":[{"t":"Từ chủ đề 1 · Học tập và kỹ năng","can":"Sau buổi này bạn nhận ra và dùng được 15 từ chủ đề «Học tập và kỹ năng», từ «achieve» đến «make sure».","v":["achieve","brain","clever","concentrate","consider","course","degree","experience","expert","fail","guess","hesitate","instruction","make progress","make sure"],"g":[],"c":["B1U06M4","B1U06M10","B1U06M6","B1U06M1","B1U06M2","B1U06M8"]},{"t":"Từ chủ đề 2 · Học tập và kỹ năng","can":"Sau buổi này bạn nhận ra và dùng được 15 từ chủ đề «Học tập và kỹ năng», từ «mark» đến «wonder».","v":["mark","mental","pass","qualification","remind","report","revise","search","skill","smart","subject","take an exam","talented","term","wonder"],"g":[],"c":["B1U06M9","B1U06M3","B1U06M7","B1U06M5"]},{"t":"Cụm động từ và cụm giới từ 1","can":"Sau buổi này bạn chọn đúng tiểu từ và giới từ trong các cụm cố định của Unit, không dịch từng chữ từ tiếng Việt.","v":["carry on","cross out","leave out","rip up","rub out","find out","in conclusion","in fact","in favour (of)","in general","by heart","for instance"],"g":[],"c":["B1U06C1","B1U06C2","B1U06C3","B1U06C4","B1U06C5","B1U06C6","B1U06C7","B1U06C8","B1U06C9","B1U06C10","B1U06C11","B1U06C12","B1U06B1","B1U06B2","B1U06B3"]},{"t":"Giới từ theo sau động từ, tính từ, danh từ","can":"Sau buổi này bạn dùng đúng giới từ đi sau các động từ, tính từ và danh từ của Unit: lỗi mất điểm nhiều nhất của người Việt.","v":["capable of","cheat at/in","confuse sth with","cope with","learn about","a question about","succeed in","talented at","ask for","good at","an opinion about/of","a solution to"],"g":[],"c":["B1U06C13","B1U06C14","B1U06C15","B1U06C16","B1U06C17","B1U06C18","B1U06C19","B1U06C20","B1U06C21","B1U06C22","B1U06C23","B1U06C24"]},{"t":"Biến đổi từ loại và phần Nói","can":"Sau buổi này bạn đổi được từ gốc sang danh từ, tính từ hoặc dạng trái nghĩa, và nói được một phút về chủ đề của Unit.","v":["advice","begin","brave","correct","divide","educate","except","instruct","intelligent","memory","prepare","refer","silent","simple"],"g":[],"c":["B1U06F1","B1U06F2","B1U06F3","B1U06F4","B1U06F5","B1U06F6","B1U06F7","B1U06F8","B1U06D1","B1U06S1"]}],"ex":["B1U06M1","B1U06M2","B1U06M3","B1U06M4","B1U06M5","B1U06M6","B1U06M7","B1U06M8","B1U06M9","B1U06M10","B1U06C1","B1U06C2","B1U06C3","B1U06C4","B1U06C5","B1U06C6","B1U06C7","B1U06C8","B1U06C9","B1U06C10","B1U06C11","B1U06C12","B1U06C13","B1U06C14","B1U06C15","B1U06C16","B1U06C17","B1U06C18","B1U06C19","B1U06C20","B1U06C21","B1U06C22","B1U06C23","B1U06C24","B1U06B1","B1U06B2","B1U06B3","B1U06F1","B1U06F2","B1U06F3","B1U06F4","B1U06F5","B1U06F6","B1U06F7","B1U06F8","B1U06D1","B1U06S1"]},{"n":7,"t":"Unit 7 · Các cách nói về tương lai","en":"Future time (present continuous, will, be going to, present simple)","notes":[["Mục tiêu của bài","• 🎯 Chọn đúng dạng tương lai theo ý muốn nói: dự đoán, quyết định tức thời, dự định, lịch đã hẹn, lịch cố định.\n• 📖 Trong sách: Unit ngữ pháp 7, trang 30–32. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Speaking Part 1 và Part 3 hay hỏi về kế hoạch và dự đoán (What will cities be like in the future?). Writing Task 1 có biểu đồ dự báo."]],"cards":[{"p":"will + V","m":"Dự đoán, quyết định ngay lúc nói, lời hứa, lời đề nghị","u":"Dùng `will` cho dự đoán dựa trên ý kiến (I think, probably), quyết định đưa ra ngay lúc nói, lời hứa và lời đề nghị giúp đỡ. Phủ định: will not (won't).","e":"I think it will rain tomorrow.\nThe phone is ringing. I will answer it.","ev":"Tôi nghĩ mai trời sẽ mưa.\nĐiện thoại reo kìa. Để tôi nghe.","n":"Lỗi người Việt hay mắc: Sau `when`, `as soon as`, `before`, `until`, `if` không dùng `will`: ~~When I will arrive~~ → When I arrive, I will call you.","tip":"Dự đoán trong Part 3 nên kèm mức độ chắc chắn: will probably, is likely to, may.","vs":[]},{"p":"be going to + V","m":"Dự định đã có từ trước; dự đoán có căn cứ trước mắt","u":"Dùng cho kế hoạch đã quyết từ trước khi nói, và cho dự đoán dựa vào điều đang thấy.","e":"I am going to study abroad next year.\nLook at those clouds. It is going to rain.","ev":"Năm sau tôi định đi du học.\nNhìn mây kìa. Trời sắp mưa rồi.","n":null,"tip":null,"vs":[["will + V","`will` là quyết định ngay lúc nói; `be going to` là dự định đã có sẵn: \"We have no milk.\" \"I will buy some.\" / \"I know. I am going to buy some later.\""]]},{"p":"Present continuous / present simple for the future","m":"Lịch hẹn cá nhân và lịch trình cố định","u":"Hiện tại tiếp diễn cho việc đã sắp xếp với người khác, có thời gian cụ thể (I am meeting Lan at six). Hiện tại đơn cho lịch trình cố định của tàu xe, lớp học, chương trình (The train leaves at 7.15).","e":"We are having dinner with my parents on Friday.\nThe course starts on 5 May.","ev":"Thứ Sáu chúng tôi ăn tối với bố mẹ tôi.\nKhóa học bắt đầu ngày 5 tháng 5.","n":null,"tip":null,"vs":[]}],"words":[{"h":"probably","m":"có lẽ, nhiều khả năng","f":"Từ khóa của bài","e":"She will probably be late.","ev":"Có lẽ cô ấy sẽ đến muộn.","n":null},{"h":"in two days","m":"hai ngày nữa","f":"Từ khóa của bài","e":"I will see you in two days.","ev":"Hai ngày nữa gặp bạn nhé.","n":null},{"h":"the day after tomorrow","m":"ngày kia","f":"Từ khóa của bài","e":"The exam is the day after tomorrow.","ev":"Ngày kia thi.","n":null},{"h":"next","m":"tới, sau (next week, next year)","f":"Từ khóa của bài","e":"We are moving next month.","ev":"Tháng sau chúng tôi chuyển nhà.","n":null},{"h":"soon","m":"sớm, chẳng bao lâu nữa","f":"Từ khóa của bài","e":"I hope to see you soon.","ev":"Hy vọng sớm gặp lại bạn.","n":null},{"h":"until","m":"cho đến khi","f":"Từ khóa của bài","e":"Wait here until I come back.","ev":"Chờ ở đây đến khi tôi quay lại.","n":null}],"ses":[{"t":"Buổi 1 · will + V","can":"Sau buổi này bạn dùng được: dự đoán, quyết định ngay lúc nói, lời hứa, lời đề nghị; dự định đã có từ trước; dự đoán có căn cứ trước mắt; lịch hẹn cá nhân và lịch trình cố định.","v":["probably","in two days","the day after tomorrow","next","soon","until"],"g":["will + V","be going to + V","Present continuous / present simple for the future"],"c":["B1U07Q2","B1U07Q4","B1U07Q6","B1U07Q1","B1U07Q3","B1U07Q5","B1U07B1","B1U07B2","B1U07B3","B1U07F1","B1U07F2","B1U07D1","B1U07S1"]}],"ex":["B1U07Q1","B1U07Q2","B1U07Q3","B1U07Q4","B1U07Q5","B1U07Q6","B1U07B1","B1U07B2","B1U07B3","B1U07F1","B1U07F2","B1U07D1","B1U07S1"]},{"n":8,"t":"Unit 8 · Giới từ chỉ thời gian và nơi chốn","en":"Prepositions of time and place","notes":[["Mục tiêu của bài","• 🎯 Dùng đúng at, on, in và các giới từ vị trí cơ bản khi nói về thời gian và nơi chốn.\n• 📖 Trong sách: Unit ngữ pháp 8, trang 33–35. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Lỗi giới từ là lỗi phổ biến nhất của người Việt trong Writing Task 1 (in 2010, at the beginning of, between 2000 and 2010) và khi tả vị trí trên bản đồ."]],"cards":[{"p":"at / on / in + time","m":"at + giờ, thời điểm · on + ngày, thứ · in + tháng, năm, mùa, buổi","u":"| Giới từ | Dùng với | Ví dụ |\n| at | giờ; night, the weekend, the moment; at Christmas | at 7.30, at night |\n| on | thứ, ngày, ngày lễ cụ thể | on Monday, on 5 May, on my birthday |\n| in | tháng, năm, mùa, thế kỷ; the morning/afternoon/evening | in July, in 2010, in the morning |\nKhông dùng giới từ trước `last`, `next`, `this`, `every`: I saw her last week.","e":"The meeting is at nine on Monday.\nSales rose sharply in 2015.","ev":"Cuộc họp lúc chín giờ thứ Hai.\nDoanh số tăng mạnh năm 2015.","n":"Lỗi người Việt hay mắc: ~~in Monday morning~~ → on Monday morning (có thứ thì dùng on). ~~at the morning~~ → in the morning. ~~on last week~~ → last week.","tip":"Task 1: in 2010, between 2000 and 2010, from 2000 to 2010, over the period, at the beginning/end of the period.","vs":[]},{"p":"at / on / in + place","m":"at + điểm · on + bề mặt, đường · in + bên trong, vùng","u":"| Giới từ | Dùng với | Ví dụ |\n| at | một điểm, địa chỉ có số, sự kiện | at the bus stop, at 44 Hai Ba Trung, at a wedding |\n| on | bề mặt, tầng, con đường, hòn đảo nhỏ | on the wall, on the second floor, on Phu Quoc |\n| in | bên trong, thành phố, quốc gia, vùng | in the room, in Paris, in the north |","e":"She lives in a flat on the third floor.\nI will meet you at the station.","ev":"Cô ấy sống trong một căn hộ ở tầng ba.\nTôi sẽ gặp bạn ở nhà ga.","n":"Lỗi người Việt hay mắc: ~~in the bus stop~~ → at the bus stop. `arrive at` (địa điểm nhỏ) / `arrive in` (thành n đổi động từ nên rất dễ quên V3.","tip":"Task 1 quy trình: mỗi bước một câu bị động hiện tại đơn, nối bằng first, then, after that, finally.","vs":[]},{"p":"will be + V3 / have been + V3","m":"Bị động ở tương lai và hiện tại hoàn thành","u":"Tương lai: will be + V3. Hiện tại hoàn thành: have/has been + V3.","e":"The results will be announced next week.\nThe road has been closed since Monday.","ev":"Kết quả sẽ được công bố tuần sau.\nCon đường đã bị đóng từ thứ Hai.","n":"Lỗi người Việt hay mắc: ~~The results will announce~~ → will be announced. ~~has closed~~ khi con đường là thứ bị tác động → has been closed.","tip":null,"vs":[]},{"p":"Verbs that have no passive (happen, arrive, die, rise…)","m":"Nội động từ không có dạng bị động","u":"Động từ không có tân ngữ không chuyển được sang bị động: happen, occur, arrive, die, exist, rise, fall, increase (khi tự tăng).","e":"The accident happened at night.\nPrices rose by ten per cent.","ev":"Vụ tai nạn xảy ra vào ban đêm.\nGiá tăng mười phần trăm.","n":"Lỗi người Việt hay mắc: ~~The accident was happened~~, ~~Prices were risen~~ → happened, rose. Đây là lỗi rất hay gặp trong Task 1.","tip":null,"vs":[]}],"words":[{"h":"produce","m":"sản xuất","f":"Từ khóa của bài","e":"Coffee is produced in the highlands.","ev":"Cà phê được sản xuất ở vùng cao nguyên.","n":null},{"h":"deliver","m":"giao hàng","f":"Từ khóa của bài","e":"The parcel was delivered this morning.","ev":"Bưu kiện được giao sáng nay.","n":null},{"h":"announce","m":"công bố","f":"Từ khóa của bài","e":"The winner will be announced tonight.","ev":"Người thắng sẽ được công bố tối nay.","n":null},{"h":"allow","m":"cho phép","f":"Từ khóa của bài","e":"Students are not allowed to use phones.","ev":"Học sinh không được phép dùng điện thoại.","n":null},{"h":"found","m":"thành lập (found – founded – founded)","f":"Từ khóa của bài","e":"The university was founded in 1945.","ev":"Trường đại học được thành lập năm 1945.","n":null},{"h":"occur","m":"xảy ra (trang trọng; không F3","B1U12F4","B1U12F5","B1U12F6","B1U12F7","B1U12F8","B1U12D1","B1U12S1"]},{"n":13,"t":"Unit 13 · Danh từ đếm được và không đếm được","en":"Countable and uncountable nouns","notes":[["Mục tiêu của bài","• 🎯 Biết danh từ nào không thêm -s, và chọn đúng từ chỉ lượng đi kèm.\n• 📖 Trong sách: Unit ngữ pháp 13, trang 54–56. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Lỗi thêm -s vào danh từ không đếm được (informations, researches, equipments) xuất hiện rất nhiều trong bài viết của người Việt và bị tính vào Grammatical Range and Accuracy."]],"cards":[{"p":"Uncountable nouns (information, advice, furniture…)","m":"Danh từ không đếm được: không có số nhiều, không đi với a/an","u":"Động từ chia số ít. Hay gặp: advice, information, furniture, luggage, equipment, homework, knowledge, money, news, research, traffic, work, evidence, pollution, progress, accommodation.\nMuốn đếm thì dùng `a piece of`, `a bit of`: a piece of advice.","e":"The information is on the website.\nShe gave me a piece of advice.","ev":"Thông tin có trên trang web.\nCô ấy cho tôi một lời khuyên.","n":"Lỗi người Việt hay mắc: Tiếng Việt không có số nhiều nên dễ viết ~~informations~~, ~~advices~~, ~~an advice~~, ~~The news are~~ → information, advice, a piece of advice, The news is.","tip":"Trong Task 2: research shows, a great deal of evidence, much progress. Không bao giờ thêm -s.","vs":[]},{"p":"many / much · a few / a little · a lot of","m":"Từ chỉ lượng theo loại danh từ","u":"| | Đếm được (số nhiều) | Không đếm được |\n| nhiều | many, a lot of | much, a lot of |\n| một ít (đủ dùng) | a few | a little |\n| rất ít (thiếu) | few | little |\n`much` và `many` chủ yếu dùng trong câu phủ định và câu hỏi; câu khẳng định hay dùng `a lot of`.","e":"There are not many buses at night.\nWe have a little time before the film.","ev":"Ban đêm không có nhiều xe buýt.\nChúng ta còn một ít thời gian trước giờ chiếu phim.","n":"Lỗi người Việt hay mắc: ~~much people~~ → many people. ~~a few money~~ → a little money. `few` (hầu như không) khác `a few` (một vài).","tip":null,"vs":[["some / any","`some` dùng trong câu khẳng định và lời mời; `any` dùng trong câu phủ định và câu hỏi."]]},{"p":"some / any","m":"some + khẳng định · any + phủ định, nghi vấn","u":"Dùng được với cả danh từ đếm được số nhiều và không đếm được. Lời mời và lời đề nghị vẫn dùng `some`: Would you like some tea?","e":"I bought some fruit.\nIs there any milk?","ev":"Tôi mua một ít hoa quả.\nCòn sữa không?","n":null,"tip":null,"vs":[]}],"words":[{"h":"advice","m":"lời khuyên (không đếm được)","f":"Từ khóa của bài","e":"Can you give me some advice?","ev":"Bạn cho tôi vài lời khuyên được không?","n":null},{"h":"furniture","m":"đồ đạc trong nhà (không đếm được)","f":"Từ khóa của bài","e":"The furniture is new.","ev":"Đồ đạc còn mới.","n":null},{"h":"knowledge","m":"kiến thức (không đếm được)","f":"Từ khóa của bài","e":"He has a good knowledge of history.","ev":"Anh ấy có kiến thức tốt về lịch sử.","n":null},{"h":"evidence","m":"bằng chứng (không đếm được)","f":"Từ khóa của bài","e":"There is little evidence for this idea.","ev":"Có rất ít bằng chứng cho ý kiến này.","n":null},{"h":"a piece of","m":"một (mẩu, lời, món) + danh từ không đếm được","f":"Từ khóa của bài","e":"That is a useful piece of information.","ev":"Đó là một thông tin hữu ích.","n":null},{"h":"plenty of","m":"nhiều, dư dả","f":"Từ khóa của bài","e":"We have plenty of time.","ev":"Chúng ta còn nhiều thời gian.","n":null}],"ses":[{"t":"Buổi 1 · Uncountable nouns (information, advice, furniture…)","can":"Sau buổi này bạn dùng được: danh từ không đếm được: không có số nhiều, không đi với a/an; từ chỉ lượng theo loại danh từ; some + khẳng định · any + phủ định, nghi vấn.","v":["advice","furniture","knowledge","evidence","a piece of","plenty of"],"g":["Uncountable nouns (information, advice, furniture…)","many / much · a few / a little · a lot of","some / any"],"c":["B1U13Q1","B1U13Q4","B1U13Q2","B1U13Q3","B1U13Q5","B1U13B1","B1U13B2","B1U13B3","B1U13F1","B1U13F2","B1U13D1","B1U13S1"]}],"ex":["B1U13Q1","B1U13Q2","B1U13Q3","B1U13Q4","B1U13Q5","B1U13B1","B1U13B2","B1U13B3","B1U13F1","B1U13F2","B1U13D1","B1U13S1"]},{"n":14,"t":"Unit 14 · Mạo từ a/an, the và không mạo từ","en":"Articles","notes":[["Mục tiêu của bài","• 🎯 Chọn đúng a/an, the hoặc bỏ mạo từ trong các trường hợp thường gặp.\n• 📖 Trong sách: Unit ngữ pháp 14, trang 57–59. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Tiếng Việt không có mạo từ, nên đây là nhóm lỗi nhiều nhất trong bài viết của người Việt. Giảm được lỗi này là tăng trực tiếp tỷ lệ câu không lỗi."]],"cards":[{"p":"a / an","m":"Một cái bất kỳ, nhắc đến lần đầu; nghề nghiệp","u":"Dùng với danh từ đếm được số ít khi người nghe chưa biết cái nào, và khi nói nghề nghiệp. `an` đứng trước âm nguyên âm (an hour, an umbrella); `a` trước âm phụ âm (a university, a European country).\nDanh từ đếm được số ít không bao giờ đứng một mình: phải có a/an, the, my, this…","e":"She is a nurse.\nI saw a film last night. The film was about a doctor.","ev":"Cô ấy là y tá.\nTối qua tôi xem một bộ phim. Phim kể về một bác sĩ.","n":"Lỗi người Việt hay mắc: Bỏ mạo từ theo thói quen tiếng Việt: ~~She is teacher~~, ~~I have car~~ → She is a teacher, I have a car.","tip":null,"vs":[]},{"p":"the","m":"Cái đã xác định: đã nhắc, duy nhất, cả hai cùng biết","u":"Dùng khi người nghe biết cái nào: đã nhắc trước đó, chỉ có một (the sun, the government), có cụm xác định phía sau (the price of oil), so sánh nhất (the best), nhạc cụ (the piano), sông biển dãy núi (the Mekong, the Pacific), tên nước có dạng số nhiều hoặc có Kingdom/States (the Philippines, the UK).","e":"The internet has changed the way we work.\nCould you close the door, please?","ev":"Internet đã thay đổi cách chúng ta làm việc.\nBạn đóng cửa giúp được không?","n":null,"tip":"Task 1: the number of, the percentage of, the highest figure, the period.","vs":[]},{"p":"Zero article","m":"Không dùng mạo từ khi nói chung chung","u":"Không dùng mạo từ với danh từ số nhiều và danh từ không đếm được khi nói chung (Children need love), với tên người, hầu hết tên nước và thành phố, bữa ăn, môn học, ngôn ngữ, môn thể thao, và các cụm go to school / work / bed, at home, by bus.","e":"Pollution is a serious problem in big cities.\nI have lunch at work.","ev":"Ô nhiễm là vấn đề nghiêm trọng ở các thành phố lớn.\nTôi ăn trưa ở chỗ làm.","n":"Lỗi người Việt hay mắc: Thêm `the` khi nói chung: ~~The life is hard~~, ~~I like the music~~ → Life is hard, I like music.","tip":null,"vs":[["the","Dogs are friendly (chó nói chung) / The dogs next door are noisy (mấy con chó nhà bên)."]]}],"words":[{"h":"the environment","m":"môi trường (luôn có the)","f":"Từ khóa của bài","e":"We must protect the environment.","ev":"Chúng ta phải bảo vệ môi trường.","n":null},{"h":"the government","m":"chính phủ","f":"Từ khóa của bài","e":"The government has raised taxes.","ev":"Chính phủ đã tăng thuế.","n":null},{"h":"society","m":"xã hội (nói chung: không có the)","f":"Từ khóa của bài","e":"Technology has changed society.","ev":"Công nghệ đã thay đổi xã hội.","n":null},{"h":"an hour","m":"một giờ (h câm nên dùng an)","f":"Từ khóa của bài","e":"I waited for an hour.","ev":"Tôi đã chờ một tiếng.","n":null},{"h":"a university","m":"một trường đại học (âm /j/ nên dùng a)","f":"Từ khóa của bài","e":"He works at a university.","ev":"Anh ấy làm việc ở một trường đại học.","n":null}],"ses":[{"t":"Buổi 1 · a / an","can":"Sau buổi này bạn dùng được: một cái bất kỳ, nhắc đến lần đầu; nghề nghiệp; cái đã xác định: đã nhắc, duy nhất, cả hai cùng biết; không dùng mạo từ khi nói chung chung.","v":["the environment","the government","society","an hour","a university"],"g":["a / an","the","Zero article"],"c":["B1U14Q1","B1U14Q2","B1U14Q4","B1U14Q5","B1U14Q3","B1U14B1","B1U14B2","B1U14B3","B1U14F1","B1U14F2","B1U14D1","B1U14S1"]}],"ex":["B1U14Q1","B1U14Q2","B1U14Q3","B1U14Q4","B1U14Q5","B1U14B1","B1U14B2","B1U14B3","B1U14F1","B1U14F2","B1U14D1","B1U14S1"]},{"n":15,"t":"Unit 15 · Mua bán và tiền bạc","en":"Buying and selling","notes":[["Mục tiêu của bài","• 🎯 Nói về mua sắm, giá cả và tiền bạc; dùng đúng spend on, pay for, lend to, borrow from.\n• 📖 Trong sách: Unit từ vựng 15, trang 60–63. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Mua sắm và quảng cáo xuất hiện ở Speaking Part 1 và trong đề Task 2 về chủ nghĩa tiêu dùng. Listening Part 1 hay có giá tiền."]],"cards":[],"words":[{"h":"advertisement","m":"quảng cáo","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"afford","m":"có đủ tiền (để mua, làm gì)","f":"1 · Topic vocabulary","e":null,"ev":null,"n":"Họ từ: `affordable` (tính từ)"},{"h":"bargain","m":"món hời, hàng mua được giá tốt","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"brand","m":"nhãn hiệu, thương hiệu","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"catalogue","m":"ca-ta-lô, danh mục hàng","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"change","m":"tiền lẻ, tiền thối lại","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"coin","m":"đồng xu","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"cost","m":"(v) có giá là; (n) chi phí","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"customer","m":"khách hàng","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"debt","m":"khoản nợ","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"demand","m":"đòi hỏi, yêu cầu","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"export","m":"xuất k g miễn phí","f":"2 · Phrasal verbs","e":"She gave away her old books to a local school.","ev":"Cô ấy tặng sách cũ cho một trường học gần nhà.","n":null},{"h":"give back","m":"trả lại","f":"2 · Phrasal verbs","e":"Remember to give the dictionary back to the library.","ev":"Nhớ trả từ điển cho thư viện.","n":null},{"h":"pay back","m":"trả lại tiền","f":"2 · Phrasal verbs","e":"I will pay you back as soon as I get my salary.","ev":"Nhận lương xong tôi trả lại tiền cho bạn ngay.","n":null},{"h":"save up (for)","m":"để dành tiền (mua gì)","f":"2 · Phrasal verbs","e":"She is saving up for a trip to Korea.","ev":"Cô ấy đang để dành tiền đi Hàn Quốc.","n":null},{"h":"in cash","m":"bằng tiền mặt","f":"3 · Prepositional phrases","e":"Can I pay in cash?","ev":"Tôi trả bằng tiền mặt được không?","n":null},{"h":"in good/bad condition","m":"trong tình trạng tốt/xấu","f":"3 · Prepositional phrases","e":"The bike is old but in good condition.","ev":"Chiếc xe đạp cũ nhưng còn tốt.","n":null},{"h":"in debt","m":"mắc nợ","f":"3 · Prepositional phrases","e":"He lost his job and was soon in debt.","ev":"Anh ấy mất việc và chẳng bao lâu thì mắc nợ.","n":null},{"h":"for rent","m":"cho thuê","f":"3 · Prepositional phrases","e":"There is a flat for rent near the university.","ev":"Có một căn hộ cho thuê gần trường đại học.","n":null},{"h":"for sale","m":"để bán","f":"3 · Prepositional phrases","e":"Their house is for sale.","ev":"Nhà họ đang rao bán.","n":null},{"h":"an advertisement for","m":"quảng cáo cho","f":"4 · Word patterns","e":"I saw an advertisement for a part-time job.","ev":"Tôi thấy một quảng cáo tuyển việc bán thời gian.","n":null},{"h":"belong to","m":"thuộc về","f":"4 · Word patterns","e":"This bag belongs to my sister.","ev":"Cái túi này của chị tôi.","n":null},{"h":"borrow sth from","m":"mượn cái gì từ","f":"4 · Word patterns","e":"Can I borrow a pen from you?","ev":"Tôi mượn bạn cây bút được không?","n":null},{"h":"compare sth to/with","m":"so sánh cái gì với","f":"4 · Word patterns","e":"Compare your answers with your partner's.","ev":"Hãy so đáp án của bạn với bạn cùng cặp.","n":null},{"h":"decide on","m":"quyết định chọn","f":"4 · Word patterns","e":"We decided on a small hotel near the beach.","ev":"Chúng tôi quyết định chọn một khách sạn nhỏ gần biển.","n":null},{"h":"lend sth to","m":"cho ai mượn cái gì","f":"4 · Word patterns","e":"I lent my bike to a friend.","ev":"Tôi cho bạn mượn xe đạp.","n":null},{"h":"pay for","m":"trả tiền cho","f":"4 · Word patterns","e":"Who paid for the tickets?","ev":"Ai trả tiền vé thế?","n":null},{"h":"buy sth from","m":"mua cái gì từ","f":"4 · Word patterns","e":"I bought this phone from an online shop.","ev":"Tôi mua điện thoại này từ một cửa hàng trực tuyến.","n":null},{"h":"choose between","m":"chọn giữa","f":"4 · Word patterns","e":"I had to choose between two good universities.","ev":"Tôi phải chọn giữa hai trường đại học tốt.","n":null},{"h":"happy about/with","m":"hài lòng về","f":"4 · Word patterns","e":"I am happy with my new job.","ev":"Tôi hài lòng với công việc mới.","n":null},{"h":"popular with","m":"được ưa chuộng bởi","f":"4 · Word patterns","e":"The park is popular with families.","ev":"Công viên này được các gia đình ưa thích.","n":null},{"h":"spend sth on","m":"tiêu (tiền, thời gian) vào","f":"4 · Word patterns","e":"He spends a lot of money on books.","ev":"Anh ấy tiêu nhiều tiền vào sách.","n":null},{"h":"wrong about","m":"sai về","f":"4 · Word patterns","e":"I was wrong about the time of the meeting.","ev":"Tôi nhớ nhầm giờ họp.","n":null},{"h":"add","m":"thêm vào, cộng","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `addition` (danh từ)"},{"h":"compare","m":"so sánh","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `comparison` (danh từ)"},{"h":"decide","m":"quyết định","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `decision` (danh từ)"},{"h":"expense","m":"chi phí","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `expensive` (tính từ), `inexpensive` (dạng trái nghĩa)"},{"h":"serve","m":"phục vụ","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `service` (danh từ), `servant` (danh từ chỉ người)"},{"h":"true","m":"đúng, thật","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `truth` (danh từ), `untrue` (dạng trái nghĩa), `truthful` (tính từ)"},{"h":"value","m":"giá trị","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `valuable` (tính từ)"}],"ses":[{"t":"Từ chủ đề 1 · Mua bán và tiền bạc","can":"Sau buổi này bạn nhận ra và dùng được 15 từ chủ đề «Mua bán và tiền bạc», từ «advertisement» đến «import».","v":["advertisement","afford","bargain","brand","catalogue","change","coin","cost","customer","debt","demand","export","fee","fortune","import"],"g":[],"c":["B1U15M2","B1U15M4","B1U15M10","B1U15M6"]},{"t":"Từ chủ đề 2 · Mua bán và tiền bạc","can":"Sau buổi này bạn nhận ra và dùng được 15 từ chủ đề «Mua bán và tiền bạc», từ «invest» đến «waste».","v":["invest","obtain","owe","own","profit","property","purchase","receipt","require","sale","save","select","supply","variety","waste"],"g":[],"c":["B1U15M3","B1U15M1","B1U15M7","B1U15M9","B1U15M8","B1U15M5"]},{"t":"Cụm động từ và cụm giới từ 1","can":"Sau buổi này bạn chọn đúng tiểu từ và giới từ trong các cụm cố định của Unit, không dịch từng chữ từ tiếng Việt.","v":["add up","give away","give back","pay back","save up (for)","in cash","in good/bad condition","in debt","for rent","for sale"],"g":[],"c":["B1U15C1","B1U15C2","B1U15C3","B1U15C4","B1U15C5","B1U15C6","B1U15C7","B1U15C8","B1U15C9","B1U15C10","B1U15B1","B1U15B2","B1U15B3"]},{"t":"Giới từ theo sau động từ, tính từ, danh từ","can":"Sau buổi này bạn dùng đúng giới từ đi sau các động từ, tính từ và danh từ của Unit: lỗi mất điểm nhiều nhất của người Việt.","v":["an advertisement for","belong to","borrow sth from","compare sth to/with","decide on","lend sth to","pay for","buy sth from","choose between","happy about/with","popular with","spend sth on","wrong about"],"g":[],"c":["B1U15C11","B1U15C12","B1U15C13","B1U15C14","B1U15C15","B1U15C16","B1U15C17","B1U15C18","B1U15C19","B1U15C20","B1U15C21","B1U15C22","B1U15C23"]},{"t":"Biến đổi từ loại và phần Nói","can":"Sau buổi này bạn đổi được từ gốc sang danh từ, tính từ hoặc dạng trái nghĩa, và nói được một phút về chủ đề của Unit.","v":["add","compare","decide","expense","serve","true","value"],"g":[],"c":["B1U15F1","B1U15F2","B1U15F3","B1U15F4","B1U15F5","B1U15F6","B1U15F7","B1U15D1","B1U15S1"]}],"ex":["B1U15M1","B1U15M2","B1U15M3","B1U15M4","B1U15M5","B1U15M6","B1U15M7","B1U15M8","B1U15M9","B1U15M10","B1U15C1","B1U15C2","B1U15C3","B1U15C4","B1U15C5","B1U15C6","B1U15C7","B1U15C8","B1U15C9","B1U15C10","B1U15C11","B1U15C12","B1U15C13","B1U15C14","B1U15C15","B1U15C16","B1U15C17","B1U15C18","B1U15C19","B1U15C20","B1U15C21","B1U15C22","B1U15C23","B1U15B1","B1U15B2","B1U15B3","B1U15F1","B1U15F2","B1U15F3","B1U15F4","B1U15F5","B1U15F6","B1U15F7","B1U15D1","B1U15S1"]},{"n":16,"t":"Unit 16 · Đại từ và từ sở hữu","en":"Pronouns and possessive determiners","notes":[["Mục tiêu của bài","• 🎯 Dùng đúng đại từ chủ ngữ, tân ngữ, tính từ sở hữu, đại từ sở hữu và đại từ phản thân.\n• 📖 Trong sách: Unit ngữ pháp 16, trang 66–68. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Đại từ dùng đúng làm bài viết liền mạch (Coherence and Cohesion): this, these, they, it thay cho việc lặp danh từ."]],"cards":[{"p":"Subject and object pronouns (I/me, he/him, they/them…)","m":"Đại từ chủ ngữ và tân ngữ","u":"| Chủ ngữ | I | you | he | she | it | we | they |\n| Tân ngữ | me | you | him | her | it | us | them |\nSau động từ và giới từ dùng dạng tân ngữ.","e":"She told me about them.\nBetween you and me, I do not like it.","ev":"Cô ấy kể cho tôi về họ.\nNói riêng với bạn, tôi không thích nó.","n":"Lỗi người Việt hay mắc: Lặp chủ ngữ theo kiểu tiếng Việt: ~~My brother he works~~ → My brother works. Nhầm he/she khi nói nhanh.","tip":null,"vs":[]},{"p":"Possessive determiners and pronouns (my/mine, their/theirs…)","m":"Tính từ sở hữu và đại từ sở hữu","u":"| Trước danh từ | my | your | his | her | its | our | their |\n| Đứng một mình | mine | yours | his | hers | – | ours | theirs |","e":"This is my book and that one is yours.\nThe company changed its name.","ev":"Đây là sách của tôi còn cuốn kia của bạn.\nCông ty đã đổi tên.","n":"Lỗi người Việt hay mắc: `its` (của nó) không có dấu nháy; `it's` = it is. ~~a friend of me~~ → a friend of mine.","tip":null,"vs":[]},{"p":"Reflexive pronouns (myself, yourself, themselves…)","m":"Đại từ phản thân","u":"Dùng khi chủ ngữ và tân ngữ là một (I hurt myself), hoặc để nhấn mạnh \"tự mình\" (I did it myself). `by myself` = một mình.","e":"He taught himself to play the guitar.\nWe enjoyed ourselves at the party.","ev":"Anh ấy tự học chơi ghi-ta.\nChúng tôi đã rất vui ở bữa tiệc.","n":null,"tip":null,"vs":[]}],"words":[{"h":"each other","m":"lẫn nhau","f":"Từ khóa của bài","e":"They help each other with homework.","ev":"Họ giúp nhau làm bài tập.","n":null},{"h":"one another","m":"lẫn nhau (trang trọng hơn)","f":"Từ khóa của bài","e":"People should respect one another.","ev":"Mọi người nên tôn trọng lẫn nhau.","n":null},{"h":"own","m":"của riêng (my own room)","f":"Từ khóa của bài","e":"She has her own business.","ev":"Cô ấy có công việc kinh doanh riêng.","n":null},{"h":"belong to","m":"thuộc về","f":"Từ khóa của bài","e":"This land belongs to them.","ev":"Mảnh đất này của họ.","n":null},{"h":"themselves","m":"chính họ, tự họ","f":"Từ khóa của bài","e":"Children can learn by themselves.","ev":"Trẻ em có thể tự học.","n":null}],"ses":[{"t":"Buổi 1 · Subject and object pronouns (I/me, he/him, they/them…)","can":"Sau buổi này bạn dùng được: đại từ chủ ngữ và tân ngữ; tính từ sở hữu và đại từ sở hữu; đại từ phản thân.","v":["each other","one another","own","belong to","themselves"],"g":["Subject and object pronouns (I/me, he/him, they/them…)","Possessive determiners and pronouns (my/mine, their/theirs…)","Reflexive pronouns (myself, yourself, themselves…)"],"c":["B1U16Q1","B1U16Q2","B1U16Q3","B1U16Q5","B1U16Q4","B1U16B1","B1U16B2","B1U16B3","B1U16F1","B1U16F2","B1U16D1","B1U16S1"]}],"ex":["B1U16Q1","B1U16Q2","B1U16Q3","B1U16Q4","B1U16Q5","B1U16B1","B1U16B2","B1U16B3","B1U16F1","B1U16F2","B1U16D1","B1U16S1"]},{"n":17,"t":"Unit 17 · Mệnh đề quan hệ","en":"Relative clauses","notes":[["Mục tiêu của bài","• 🎯 Nối hai câu thành một bằng who, which, that, whose, where, when; biết khi nào cần dấu phẩy.\n• 📖 Trong sách: Unit ngữ pháp 17, trang 69–71. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Mệnh đề quan hệ là cách dễ nhất để có câu phức đúng, thứ bảng mô tả band yêu cầu từ band 6 trở lên ở tiêu chí ngữ pháp."]],"cards":[{"p":"Defining relative clauses: who / which / that","m":"Mệnh đề quan hệ xác định (không có dấu phẩy)","u":"Cho biết đang nói người nào, vật nào. `who` / `that` cho người; `which` / `that` cho vật. Khi đại từ quan hệ làm tân ngữ có thể lược bỏ: the book (that) I bought.","e":"People who exercise regularly are healthier.\nThis is the phone that I bought last week.","ev":"Những người tập thể dục đều đặn thì khỏe mạnh hơn.\nĐây là chiếc điện thoại tôi mua tuần trước.","n":"Lỗi người Việt hay mắc: Lặp lại tân ngữ hoặc chủ ngữ: ~~the book that I bought it~~, ~~people who they live~~ → the book that I bought, people who live. Nhầm `who` cho vật: ~~the car who~~ → the car which/that.","tip":"Một câu Task 2 mẫu: Children who read a lot usually write better.","vs":[]},{"p":"whose / where / when","m":"whose (của) · where (nơi) · when (lúc)","u":"`whose` + danh từ chỉ sở hữu; `where` thay cho nơi chốn (= in which); `when` thay cho thời gian.","e":"I have a friend whose father is a pilot.\nThis is the town where I grew up.","ev":"Tôi có người bạn mà bố là phi công.\nĐây là thị trấn nơi tôi lớn lên.","n":"Lỗi người Việt hay mắc: ~~the town where I grew up in~~ → the town where I grew up / the town which I grew up in.","tip":null,"vs":[]},{"p":"Non-defining relative clauses: , who / , which","m":"Mệnh đề quan hệ không xác định (có dấu phẩy)","u":"Thêm thông tin phụ về người hoặc vật đã rõ là ai, cái gì. Luôn có dấu phẩy, không dùng `that`, không lược bỏ đại từ quan hệ.","e":"My mother, who is a teacher, loves reading.\nHanoi, which is the capital of Vietnam, is over 1,000 years old.","ev":"Mẹ tôi, một giáo viên, rất thích đọc sách.\nHà Nội, thủ đô của Việt Nam, đã hơn 1.000 năm tuổi.","n":"Lỗi người Việt hay mắc: Sau dấu phẩy không dùng `that`: ~~Hanoi, that is the capital~~ → Hanoi, which is the capital.","tip":null,"vs":[["Defining relative clauses: who / which / that","Không phẩy: cần thông tin đó để biết là ai. Có phẩy: bỏ đi câu vẫn đủ nghĩa."]]}],"words":[{"h":"whose","m":"của người mà, của cái mà","f":"Từ khóa của bài","e":"She is the writer whose book I read.","ev":"Cô ấy là tác giả của cuốn sách tôi đã đọc.","n":null},{"h":"where","m":"nơi mà","f":"Từ khóa của bài","e":"The cafe where we met has closed.","ev":"Quán cà phê nơi chúng tôi gặp nhau đã đóng cửa.","n":null},{"h":"reason why","m":"lý do vì sao","f":"Từ khóa của bài","e":"That is the reason why I left.","ev":"Đó là lý do tôi rời đi.","n":null},{"h":"the one","m":"cái mà, người mà","f":"Từ khóa của bài","e":"This is the one I want.","ev":"Đây là cái tôi muốn.","n":null},{"h":"regularly","m":"đều đặn","f":"Từ khóa của bài","e":"He exercises regularly.","ev":"Anh ấy tập thể dục đều đặn.","n":null}],"ses":[{"t":"Buổi 1 · Defining relative clauses","can":"Sau buổi này bạn dùng được: mệnh đề quan hệ xác định (không có dấu phẩy); whose (của) · where (nơi) · when (lúc); mệnh đề quan hệ không xác định (có dấu phẩy).","v":["whose","where","reason why","the one","regularly"],"g":["Defining relative clauses: who /  cho các thì khác (will be able to, have been able to). Một việc cụ thể đã làm được trong quá khứ dùng `was able to` / `managed to`, không dùng `could`.","e":"She can speak three languages.\nThe exam was hard, but I was able to finish it.","ev":"Cô ấy nói được ba thứ tiếng.\nBài thi khó nhưng tôi đã làm xong được.","n":"Lỗi người Việt hay mắc: Sau động từ khuyết thiếu là động từ nguyên mẫu không `to`, không chia: ~~can to swim~~, ~~she cans~~, ~~will can~~ → can swim, she can, will be able to.","tip":null,"vs":[]},{"p":"can / could / may (permission and requests)","m":"Xin phép và đề nghị","u":"`Can I…?` thân mật; `Could I…?` lịch sự hơn; `May I…?` trang trọng. Nhờ ai làm gì: Can you / Could you…?","e":"Could I ask you a question?\nYou can leave early today.","ev":"Tôi hỏi bạn một câu được không?\nHôm nay bạn có thể về sớm.","n":null,"tip":null,"vs":[]},{"p":"should / ought to","m":"Lời khuyên, điều nên làm","u":"`should` + V và `ought to` + V cùng nghĩa; `should` phổ biến hơn. Phủ định: should not (shouldn't).","e":"You should see a doctor.\nGovernments ought to invest more in schools.","ev":"Bạn nên đi khám.\nChính phủ nên đầu tư nhiều hơn vào trường học.","n":null,"tip":"Task 2: Governments should…, Parents should not…, More money should be spent on…","vs":[["must","`should` là lời khuyên; `must` là bắt buộc."]]}],"words":[{"h":"manage to","m":"xoay xở làm được","f":"Từ khóa của bài","e":"I managed to pass the test.","ev":"Tôi đã xoay xở qua được bài kiểm tra.","n":null},{"h":"be able to","m":"có thể, có khả năng","f":"Từ khóa của bài","e":"I will be able to help you tomorrow.","ev":"Mai tôi có thể giúp bạn.","n":null},{"h":"ought to","m":"nên","f":"Từ khóa của bài","e":"You ought to rest.","ev":"Bạn nên nghỉ ngơi.","n":null},{"h":"allow","m":"cho phép","f":"Từ khóa của bài","e":"Phones are not allowed in the exam.","ev":"Không được mang điện thoại vào phòng thi.","n":null},{"h":"had better","m":"tốt hơn là nên (cảnh báo)","f":"Từ khóa của bài","e":"You had better hurry.","ev":"Bạn nên nhanh lên thì hơn.","n":null}],"ses":[{"t":"Buổi 1 · can / could / be able to","can":"Sau buổi này bạn dùng được: khả năng; xin phép và đề nghị; lời khuyên, điều nên làm.","v":["manage to","be able to","ought to","allow","had better"],"g":["can / could / be able to","can / could / may (permission and requests)","should / ought to"],"c":["B1U19Q1","B1U19Q2","B1U19Q5","B1U19Q4","B1U19Q3","B1U19B1","B1U19B2","B1U19B3","B1U19F1","B1U19F2","B1U19D1","B1U19S1"]}],"ex":["B1U19Q1","B1U19Q2","B1U19Q3","B1U19Q4","B1U19Q5","B1U19B1","B1U19B2","B1U19B3","B1U19F1","B1U19F2","B1U19D1","B1U19S1"]},{"n":20,"t":"Unit 20 · Động từ khuyết thiếu 2: bắt buộc, khả năng xảy ra","en":"Modals 2: obligation, probability, possibility","notes":[["Mục tiêu của bài","• 🎯 Nói điều bắt buộc, điều cấm, điều không cần, và mức độ chắc chắn của một phán đoán.\n• 📖 Trong sách: Unit ngữ pháp 20, trang 81–83. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Giới hạn mức độ chắc chắn (may, might, could) giúp tránh nhận định tuyệt đối trong Task 2 và Part 3."]],"cards":[{"p":"must / have to","m":"Bắt buộc","u":"`must` là bắt buộc do người nói thấy cần; `have to` là bắt buộc do quy định, hoàn cảnh. Quá khứ của cả hai là `had to`; tương lai là `will have to`.","e":"I must call my mother tonight.\nStudents have to wear a uniform.","ev":"Tối nay tôi phải gọi cho mẹ.\nHọc sinh phải mặc đồng phục.","n":"Lỗi người Việt hay mắc: ~~must to go~~ → must go. ~~I must went~~ → I had to go.","tip":null,"vs":[]},{"p":"mustn't / don't have to","m":"Cấm / không cần","u":"`mustn't` = không được phép (cấm). `don't have to` / `needn't` = không cần, làm cũng được.","e":"You mustn't use your phone in the exam.\nYou don't have to come if you are busy.","ev":"Bạn không được dùng điện thoại trong phòng thi.\nNếu bận thì bạn không cần đến.","n":"Lỗi người Việt hay mắc: Hai dạng phủ định có nghĩa trái ngược hẳn nhau. \"Không phải làm\" trong tiếng Việt là `don't have to`, không phải `mustn't`.","tip":null,"vs":[["must / have to","Ở dạng khẳng định gần nghĩa nhau; ở dạng phủ định thì khác hẳn."]]},{"p":"must / may / might / could / can't (probability)","m":"Mức độ chắc chắn của phán đoán","u":"| Mức độ | Dạng | Ví dụ |\n| Chắc chắn đúng | must | She must be at work. |\n| Có thể | may / might / could | It might rain. |\n| Chắc chắn sai | can't | That can't be true. |\nPhủ định của `must` (phán đoán) là `can't`, không phải `mustn't`.","e":"He has not eaten all day. He must be hungry.\nThis may be one reason for the problem.","ev":"Cả ngày anh ấy chưa ăn. Chắc hẳn đói lắm.\nĐây có thể là một nguyên nhân của vấn đề.","n":null,"tip":"Task 2: This may lead to…, Children might become…, tránh viết This will cause… khi chưa chắc.","vs":[]}],"words":[{"h":"need to","m":"cần phải","f":"Từ khóa của bài","e":"You need to book in advance.","ev":"Bạn cần đặt trước.","n":null},{"h":"needn't","m":"không cần","f":"Từ khóa của bài","e":"You needn't worry.","ev":"Bạn không cần lo.","n":null},{"h":"be likely to","m":"nhiều khả năng sẽ","f":"Từ khóa của bài","e":"Prices are likely to rise.","ev":"Giá nhiều khả năng sẽ tăng.","n":null},{"h":"perhaps","m":"có lẽ","f":"Từ khóa của bài","e":"Perhaps he forgot.","ev":"Có lẽ anh ấy quên.","n":null},{"h":"compulsory","m":"bắt buộc","f":"Từ khóa của bài","e":"Education is compulsory until the age of 15.","ev":"Giáo dục là bắt buộc đến năm 15 tuổi.","n":null}],"ses":[{"t":"Buổi 1 · must / have to","can":"Sau buổi này bạn dùng được: bắt buộc; cấm / không cần; mức độ chắc chắn của phán đoán.","v":["need to","needn't","be likely to","perhaps","compulsory"],"g":["must / have to","mustn't / don't have to","must / may / might / could / can't (probability)"],"c":["B1U20Q5","B1U20Q1","B1U20Q2","B1U20Q3","B1U20Q4","B1U20B1","B1U20B2","B1U20B3","B1U20F1","B1U20F2","B1U20D1","B1U20S1"]}],"ex":["B1U20Q1"," ,"B1U21C15","B1U21C16","B1U21C17","B1U21C18","B1U21C19","B1U21C20","B1U21C21","B1U21C22","B1U21C23","B1U21C24","B1U21C25","B1U21B1","B1U21B2","B1U21B3","B1U21F1","B1U21F2","B1U21F3","B1U21F4","B1U21F5","B1U21F6","B1U21F7","B1U21F8","B1U21D1","B1U21S1"]},{"n":22,"t":"Unit 22 · Động từ khuyết thiếu 3: modal + have + V3","en":"Modals 3: the modal perfect","notes":[["Mục tiêu của bài","• 🎯 Phán đoán và nhận xét về việc trong quá khứ: chắc là đã, có thể đã, lẽ ra nên.\n• 📖 Trong sách: Unit ngữ pháp 22, trang 94–96. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Part 2 và Part 3 hay cần nói điều tiếc nuối hoặc suy đoán về quá khứ: I should have studied harder."]],"cards":[{"p":"must have / can't have / might have + V3","m":"Suy đoán về quá khứ","u":"`must have + V3` = chắc hẳn đã; `can't have + V3` = chắc chắn đã không; `may / might / could have + V3` = có thể đã.","e":"The ground is wet. It must have rained.\nShe can't have left; her bag is still here.","ev":"Mặt đất ướt. Chắc hẳn trời đã mưa.\nCô ấy không thể đã về được; túi vẫn còn đây.","n":"Lỗi người Việt hay mắc: ~~must rained~~, ~~must have rain~~ → must have rained. Cần đủ ba phần: modal + have + V3.","tip":null,"vs":[]},{"p":"should have / shouldn't have + V3","m":"Lẽ ra nên / lẽ ra không nên","u":"Nói về việc đã không làm đúng trong quá khứ: tiếc nuối hoặc trách.","e":"I should have left earlier.\nYou shouldn't have told him.","ev":"Lẽ ra tôi nên đi sớm hơn.\nLẽ ra bạn không nên nói với anh ấy.","n":null,"tip":"Kể chuyện ở Part 2 có thêm một câu tiếc nuối sẽ tự nhiên hơn: Looking back, I should have asked for help.","vs":[]},{"p":"could have / would have + V3","m":"Đã có thể làm nhưng không làm","u":"`could have + V3` = đã có khả năng nhưng việc đó không xảy ra. `would have + V3` = đã sẽ làm nếu hoàn cảnh khác (nối sang câu điều kiện loại ba ở Unit 29).","e":"You could have called me.\nI would have helped, but I did not know.","ev":"Bạn đã có thể gọi cho tôi mà.\nTôi đã giúp rồi, nhưng tôi không biết.","n":null,"tip":null,"vs":[]}],"words":[{"h":"obviously","m":"rõ ràng là","f":"Từ khóa của bài","e":"He obviously forgot.","ev":"Rõ ràng là anh ấy đã quên.","n":null},{"h":"by mistake","m":"do nhầm lẫn","f":"Từ khóa của bài","e":"I must have taken your pen by mistake.","ev":"Chắc tôi đã cầm nhầm bút của bạn.","n":null},{"h":"regret","m":"hối tiếc","f":"Từ khóa của bài","e":"I regret not studying harder.","ev":"Tôi tiếc vì đã không học chăm hơn.","n":null},{"h":"looking back","m":"nhìn lại thì","f":"Từ khóa của bài","e":"Looking back, it was a mistake.","ev":"Nhìn lại thì đó là một sai lầm.","n":null},{"h":"instead","m":"thay vào đó","f":"Từ khóa của bài","e":"I should have walked instead.","ev":"Lẽ ra tôi nên đi bộ.","n":null}],"ses":[{"t":"Buổi 1 · must have / can't have / might have + V3","can":"Sau buổi này bạn dùng được: suy đoán về quá khứ; lẽ ra nên / lẽ ra không nên; đã có thể làm nhưng không làm.","v":["obviously","by mistake","regret","looking back","instead"],"g":["must have / can't have / might have + V3","should have / shouldn't have + V3","could have / would have + V3"],"c":["B1U22Q1","B1U22Q3","B1U22Q4","B1U22Q2","B1U22Q5","B1U22B1","B1U22B2","B1U22B3","B1U22F1","B1U22F2","B1U22D1","B1U22S1"]}],"ex":["B1U22Q1","B1U22Q2","B1U22Q3","B1U22Q4","B1U22Q5","B1U22B1","B1U22B2","B1U22B3","B1U22F1","B1U22F2","B1U22D1","B1U22S1"]},{"n":23,"t":"Unit 23 · Câu hỏi, câu hỏi đuôi, câu hỏi gián tiếp","en":"Questions, question tags, indirect questions","notes":[["Mục tiêu của bài","• 🎯 Đặt câu hỏi đúng trật tự từ, dùng câu hỏi đuôi và hỏi gián tiếp cho lịch sự.\n• 📖 Trong sách: Unit ngữ pháp 23, trang 97–99. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Nghe hiểu câu hỏi của giám khảo ở Part 1 và Part 3 phụ thuộc vào việc nhận ra dạng câu hỏi. Câu hỏi gián tiếp cũng xuất hiện trong Listening Part 1."]],"cards":[{"p":"Question word order","m":"Trật tự câu hỏi: (từ hỏi) + trợ động từ + chủ ngữ + động từ","u":"Yes/No: Do you like it? · Is she working? · Have they left? Câu hỏi có từ hỏi: Where do you live? Khi từ hỏi là chủ ngữ thì không dùng `do/does/did`: Who called you?","e":"How long have you lived here?\nWho told you that?","ev":"Bạn sống ở đây bao lâu rồi?\nAi nói với bạn điều đó?","n":"Lỗi người Việt hay mắc: Giữ trật tự câu kể như tiếng Việt: ~~Where you live?~~, ~~Why she is late?~~ → Where do you live? Why is she late?","tip":null,"vs":[]},{"p":"Question tags","m":"Câu hỏi đuôi: khẳng định → đuôi phủ định, và ngược lại","u":"Dùng lại trợ động từ của câu chính và đổi dấu: You are tired, aren't you? · She doesn't smoke, does she? Câu không có trợ động từ thì dùng do/does/did. Đặc biệt: I am…, aren't I? · Let's…, shall we?","e":"It is cold today, isn't it?\nYou have not seen my keys, have you?","ev":"Hôm nay lạnh nhỉ?\nBạn không thấy chìa khóa của tôi phải không?","n":"Lỗi người Việt hay mắc: Trả lời theo sự thật, không theo kiểu \"vâng/không\" của tiếng Việt: \"You don't eat meat, do you?\" → \"No, I don't\" (đúng là tôi không ăn).","tip":null,"vs":[]},{"p":"Indirect questions","m":"Câu hỏi gián tiếp: sau cụm mở đầu, trật tự như câu kể","u":"Mở đầu bằng Could you tell me…, Do you know…, I wonder…, I would like to know… Sau đó là từ hỏi (hoặc if/whether) + chủ ngữ + động từ, không đảo, không dùng do/does/did.","e":"Could you tell me where the station is?\nDo you know if the shop opens on Sundays?","ev":"Bạn chỉ giúp tôi nhà ga ở đâu được không?\nBạn có biết cửa hàng có mở Chủ nhật không?","n":"Lỗi người Việt hay mắc: ~~Could you tell me where is the station?~~, ~~Do you know what time does it start?~~ → where the station is, what time it starts.","tip":null,"vs":[]}],"words":[{"h":"whether","m":"liệu có… hay không","f":"Từ khóa của bài","e":"I wonder whether he will come.","ev":"Tôi tự hỏi liệu anh ấy có đến không.","n":null},{"h":"how often","m":"bao lâu một lần","f":"Từ khóa của bài","e":"How often do you exercise?","ev":"Bạn tập thể dục bao lâu một lần?","n":null},{"h":"how far","m":"bao xa","f":"Từ khóa của bài","e":"How far is it to the beach?","ev":"Đến bãi biển bao xa?","n":null},{"h":"what kind of","m":"loại nào","f":"Từ khóa của bài","e":"What kind of music do you like?","ev":"Bạn thích loại nhạc nào?","n":null},{"h":"I wonder","m":"tôi tự hỏi, không biết là","f":"Từ khóa của bài","e":"I wonder why she left.","ev":"Không biết vì sao cô ấy bỏ đi.","n":null}],"ses":[{"t":"Buổi 1 · Question word order","can":"Sau buổi này bạn dùng được: trật tự câu hỏi: (từ hỏi) + trợ động từ + chủ ngữ + động từ; câu hỏi đuôi: khẳng định → đuôi phủ định, và ngược lại; câu hỏi gián tiếp: sau cụm mở đầu, trật tự như câu kể.","v":["whether","how often","how far","what kind of","I wonder"],"g":["Question word order","Question tags","Indirect questions"],"c":["B1U23Q1","B1U23Q2","B1U23Q3","B1U23Q4","B1U23Q5","B1U23B1","B1U23B2","B1U23B3","B1U23F1","B1U23F2","B1U23D1","B1U23S1"]}],"ex":["B1U23Q1","B1U23Q2","B1U23Q3","B1U23Q4","B1U23Q5","B1U23B1","B1U23B2","B1U23B3","B1U23F1","B1U23F2","B1U23D1","B1U23S1"]},{"n":24,"t":"Unit 24 · Con người và đời sống xã hội","en":"People and daily life","notes":[["Mục tiêu của bài","• 🎯 Nói về xã hội, cộng đồng, luật pháp và thói quen; phân biệt rob và steal.\n• 📖 Trong sách: Unit từ vựng 24, trang 100–103. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Tội phạm, cộng đồng và truyền thống là nhóm chủ đề lớn của Writing Task 2 và Speaking Part 3."]],"cards":[],"words":[{"h":"admit","m":"thừa nhận","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"arrest","m":"bắt giữ","f":"1 · Topic vocabular
