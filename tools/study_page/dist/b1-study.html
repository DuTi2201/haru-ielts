ary","e":null,"ev":null,"n":null},{"h":"situation","m":"tình huống, hoàn cảnh","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"social","m":"thuộc về xã hội","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"society","m":"xã hội","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"steal","m":"ăn trộm (đồ vật): steal money","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"tradition","m":"truyền thống","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"typical","m":"điển hình, tiêu biểu","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"vote","m":"(v) bỏ phiếu; (n) lá phiếu","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"youth club","m":"câu lạc bộ thanh thiếu niên","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"catch up (with)","m":"bắt kịp","f":"2 · Phrasal verbs","e":"I missed two lessons, so I need to catch up with the class.","ev":"Tôi nghỉ hai buổi nên phải học cho kịp lớp.","n":null},{"h":"wake up","m":"tỉnh giấc","f":"2 · Phrasal verbs","e":"I woke up three times during the night.","ev":"Đêm qua tôi tỉnh giấc ba lần.","n":null},{"h":"wash up","m":"rửa bát","f":"2 · Phrasal verbs","e":"I cook and my brother washes up.","ev":"Tôi nấu còn em trai tôi rửa bát.","n":null},{"h":"get away with","m":"thoát tội, không bị phạt","f":"2 · Phrasal verbs","e":"He cheated in the test but did not get away with it.","ev":"Cậu ấy gian lận trong bài kiểm tra nhưng không thoát được.","n":null},{"h":"get up","m":"thức dậy, ra khỏi giường","f":"2 · Phrasal verbs","e":"I get up at six on weekdays.","ev":"Ngày thường tôi dậy lúc sáu giờ.","n":null},{"h":"move in","m":"dọn đến ở","f":"2 · Phrasal verbs","e":"Our new neighbours moved in last weekend.","ev":"Hàng xóm mới của chúng tôi dọn đến cuối tuần trước.","n":null},{"h":"put away","m":"cất đi","f":"2 · Phrasal verbs","e":"Put your phone away during the exam.","ev":"Cất điện thoại đi trong giờ thi.","n":null},{"h":"put up","m":"treo lên, dán lên (tường)","f":"2 · Phrasal verbs","e":"The school put up a notice about the trip.","ev":"Trường dán thông báo về chuyến đi.","n":null},{"h":"at the age of","m":"ở tuổi","f":"3 · Prepositional phrases","e":"He started school at the age of six.","ev":"Cậu ấy đi học năm sáu tuổi.","n":null},{"h":"against the law","m":"trái pháp luật","f":"3 · Prepositional phrases","e":"It is against the law to drive without a licence.","ev":"Lái xe không có bằng là trái pháp luật.","n":null},{"h":"in public","m":"ở nơi công cộng, trước đám đông","f":"3 · Prepositional phrases","e":"I get nervous when I speak in public.","ev":"Tôi run khi nói trước đám đông.","n":null},{"h":"in response to","m":"để đáp lại","f":"3 · Prepositional phrases","e":"I am writing in response to your advertisement.","ev":"Tôi viết thư này để phản hồi quảng cáo của quý công ty.","n":null},{"h":"in your teens/twenties","m":"ở tuổi thiếu niên/tuổi đôi mươi","f":"3 · Prepositional phrases","e":"He moved abroad in his twenties.","ev":"Anh ấy ra nước ngoài khi ngoài hai mươi tuổi.","n":null},{"h":"at last","m":"cuối cùng (sau thời gian dài chờ đợi)","f":"3 · Prepositional phrases","e":"At last the rain stopped.","ev":"Cuối cùng mưa cũng tạnh.","n":null},{"h":"blame sth on","m":"đổ lỗi việc gì cho","f":"4 · Word patterns","e":"They blamed the accident on the weather.","ev":"Họ đổ lỗi vụ tai nạn cho thời tiết.","n":null},{"h":"blame sb for","m":"trách ai vì","f":"4 · Word patterns","e":"Nobody blamed him for the mistake.","ev":"Không ai trách anh ấy vì sai sót đó.","n":null},{"h":"forget about","m":"quên mất","f":"4 · Word patterns","e":"Do not forget about the meeting tomorrow.","ev":"Đừng quên cuộc họp ngày mai.","n":null},{"h":"guilty of","m":"có tội","f":"4 · Word patterns","e":"He was found guilty of theft.","ev":"Anh ta bị kết tội trộm cắp.","n":null},{"h":"punish sb for","m":"phạt ai vì","f":"4 · Word patterns","e":"He was punished for breaking the rules.","ev":"Cậu ấy bị phạt vì vi phạm nội quy.","n":null},{"h":"share sth with","m":"chia sẻ cái gì với","f":"4 · Word patterns","e":"I share a flat with two friends.","ev":"Tôi ở chung căn hộ với hai người bạn.","n":null},{"h":"angry (with sb) about","m":"giận (ai) về","f":"4 · Word patterns","e":"He was angry about the delay.","ev":"Anh ấy bực vì sự chậm trễ.","n":null},{"h":"criticise sb for","m":"chỉ trích ai vì","f":"4 · Word patterns","e":"The manager criticised the team for arriving late.","ev":"Quản lý phê bình cả nhóm vì đến muộn.","n":null},{"h":"forgive sb for","m":"tha thứ cho ai vì","f":"4 · Word patterns","e":"She forgave him for lying.","ev":"Cô ấy tha thứ cho anh ta vì đã nói dối.","n":null},{"h":"know about","m":"biết về","f":"4 · Word patterns","e":"What do you know about solar energy?","ev":"Bạn biết gì về năng lượng mặt trời?","n":null},{"h":"late for","m":"muộn (việc gì)","f":"4 · Word patterns","e":"I was late for work twice last week.","ev":"Tuần trước tôi đi làm muộn hai lần.","n":null},{"h":"ready for","m":"sẵn sàng cho","f":"4 · Word patterns","e":"Are you ready for the trip?","ev":"Bạn sẵn sàng cho chuyến đi chưa?","n":null},{"h":"agree","m":"đồng ý","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `agreement` (danh từ), `disagree` (dạng trái nghĩa)"},{"h":"courage","m":"lòng can đảm","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `courageous` (tính từ)"},{"h":"elect","m":"bầu chọn","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `election` (danh từ)"},{"h":"equal","m":"bình đẳng, bằng nhau","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `equality` (danh từ), `unequal` (dạng trái nghĩa)"},{"h":"free","m":"tự do; miễn phí","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `freedom` (danh từ)"},{"h":"identify","m":"nhận dạng","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `identity` (danh từ), `identical` (tính từ)"},{"h":"invade","m":"xâm lược","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `invasion` (danh từ), `invader` (danh từ chỉ người)"},{"h":"judge","m":"đánh giá, xét xử","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `judgement` (danh từ)"},{"h":"life","m":"cuộc sống","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `live` (động từ), `alive` (tính từ)"},{"h":"nation","m":"quốc gia","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `nationality` (danh từ), `national` (tính từ), `international` (tính từ)"},{"h":"peace","m":"hòa bình, sự yên bình","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `peaceful` (tính từ), `peacefully` (trạng từ)"},{"h":"shoot","m":"bắn","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `shot` (quá khứ đơn), `shooting` (danh từ)"}],"ses":[{"t":"Từ chủ đề 1 · Con người và đời sống xã hội","can":"Sau buổi này bạn nhận ra và dùng được 15 từ chủ đề «Con người và đời sống xã hội», từ «admit» đến «population».","v":["admit","arrest","charity","commit","community","court","criminal","culture","familiar","government","habit","identity card","illegal","politics","population"],"g":[],"c":["B1U24M2","B1U24M5","B1U24M10","B1U24M8","B1U24M6","B1U24M1","B1U24M4"]},{"t":"Từ chủ đề 2 · Con người và đời sống xã hội","can":"Sau buổi này bạn nhận ra và dùng được 15 từ chủ đề «Con người và đời sống xã hội», từ «prison» đến «youth club».","v":["prison","protest","resident","responsible","rob","routine","schedule","situation","social","society","steal","tradition","typical","vote","youth club"],"g":[],"c":["B1U24M9","B1U24M7","B1U24M3"]},{"t":"Cụm động từ và cụm giới từ 1","can":"Sau buổi này bạn chọn đúng tiểu từ và giới từ trong các cụm cố định của Unit, không dịch từng chữ từ tiếng Việt.","v":["catch up (with)","wake up","wash up","get away with","get up","move in","put away","put up","at the age of","against the law","in public","in response to","in your teens/twenties","at last"],"g":[],"c":["B1U24C1","B1U24C2","B1U24C3","B1U24C4","B1U24C5","B1U24C6","B1U24C7","B1U24C8","B1U24C9","B1U24C10","B1U24C11","B1U24C12","B1U24C13","B1U24C14","B1U24B1","B1U24B2","B1U24B3"]},{"t":"Giới từ theo sau động từ, tính từ, danh từ","can":"Sau buổi này bạn dùng đúng giới từ đi sau các động từ, tính từ và danh từ của Unit: lỗi mất điểm nhiều nhất của người Việt.","v":["blame sth on","blame sb for","forget about","guilty of","punish sb for","share sth with","angry (with sb) about","criticise sb for","forgive sb for","know about","late for","ready for"],"g":[],"c":["B1U24C15","B1U24C16","B1U24C17","B1U24C18","B1U24C19","B1U24C20","B1U24C21","B1U24C22","B1U24C23","B1U24C24","B1U24C25","B1U24C26"]},{"t":"Biến đổi từ loại và phần Nói","can":"Sau buổi này bạn đổi được từ gốc sang danh từ, tính từ hoặc dạng trái nghĩa, và nói được một phút về chủ đề của Unit.","v":["agree","courage","elect","equal","free","identify","invade","judge","life","nation","peace","shoot"],"g":[],"c":["B1U24F1","B1U24F2","B1U24F3","B1U24F4","B1U24F5","B1U24F6","B1U24F7","B1U24F8","B1U24D1","B1U24S1"]}],"ex":["B1U24M1","B1U24M2","B1U24M3","B1U24M4","B1U24M5","B1U24M6","B1U24M7","B1U24M8","B1U24M9","B1U24M10","B1U24C1","B1U24C2","B1U24C3","B1U24C4","B1U24C5","B1U24C6","B1U24C7","B1U24C8","B1U24C9","B1U24C10","B1U24C11","B1U24C12","B1U24C13","B1U24C14","B1U24C15","B1U24C16","B1U24C17","B1U24C18","B1U24C19","B1U24C20","B1U24C21","B1U24C22","B1U24C23","B1U24C24","B1U24C25","B1U24C26","B1U24B1","B1U24B2","B1U24B3","B1U24F1","B1U24F2","B1U24F3","B1U24F4","B1U24F5","B1U24F6","B1U24F7","B1U24F8","B1U24D1","B1U24S1"]},{"n":25,"t":"Unit 25 · so, such, too, enough","en":"So and such, too and enough","notes":[["Mục tiêu của bài","• 🎯 Diễn đạt mức độ và hệ quả: quá… đến nỗi, quá… để, đủ… để.\n• 📖 Trong sách: Unit ngữ pháp 25, trang 106–108. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","so… that và such… that là câu phức nêu nguyên nhân – kết quả, dùng tốt trong cả Task 2 lẫn Speaking."]],"cards":[{"p":"so + adj/adv (+ that) · such + (a/an) + adj + noun (+ that)","m":"Quá… đến nỗi","u":"`so` đi với tính từ hoặc trạng từ; `such` đi với cụm danh từ. Với many/much/few/little dùng `so`: so many people.","e":"The film was so boring that I fell asleep.\nIt was such a good book that I read it twice.","ev":"Phim chán đến nỗi tôi ngủ gật.\nCuốn sách hay đến nỗi tôi đọc hai lần.","n":"Lỗi người Việt hay mắc: ~~such boring~~, ~~so a good book~~ → so boring, such a good book.","tip":"Task 2: Housing is so expensive that many young people cannot leave home.","vs":[]},{"p":"too + adj/adv (+ to V)","m":"Quá… nên không thể","u":"`too` mang nghĩa quá mức, có hệ quả tiêu cực. Khác với `very` (rất) chỉ nhấn mạnh.","e":"The tea is too hot to drink.\nHe speaks too quickly for me to understand.","ev":"Trà nóng quá, không uống được.\nAnh ấy nói nhanh quá tôi không hiểu được.","n":"Lỗi người Việt hay mắc: Dùng `too` thay `very` khi khen: ~~The food was too delicious~~ → The food was very delicious.","tip":null,"vs":[["so + adj/adv (+ that) · such + (a/an) + adj + noun (+ that)","It was too cold to swim = It was so cold that we could not swim."]]},{"p":"adj/adv + enough (+ to V) · enough + noun","m":"Đủ… để","u":"`enough` đứng sau tính từ, trạng từ nhưng đứng trước danh từ.","e":"She is old enough to drive.\nWe do not have enough time.","ev":"Cô ấy đủ tuổi lái xe.\nChúng ta không đủ thời gian.","n":"Lỗi người Việt hay mắc: ~~enough old~~, ~~time enough~~ → old enough, enough time.","tip":null,"vs":[]}],"words":[{"h":"such","m":"đến thế, như vậy","f":"Từ khóa của bài","e":"I have never seen such a big city.","ev":"Tôi chưa từng thấy thành phố nào lớn như vậy.","n":null},{"h":"enough","m":"đủ","f":"Từ khóa của bài","e":"Is there enough food for everyone?","ev":"Có đủ đồ ăn cho mọi người không?","n":null},{"h":"too much","m":"quá nhiều (+ không đếm được)","f":"Từ khóa của bài","e":"There is too much traffic.","ev":"Xe cộ quá đông.","n":null},{"h":"too many","m":"quá nhiều (+ đếm được)","f":"Từ khóa của bài","e":"There are too many cars.","ev":"Có quá nhiều ô tô.","n":null},{"h":"as a result","m":"kết quả là","f":"Từ khóa của bài","e":"He did not study and, as a result, he failed.","ev":"Cậu ấy không học và kết quả là thi trượt.","n":null}],"ses":[{"t":"Buổi 1 · so + adj/adv (+ that) · such + (a/an) + adj + noun (+ that)","can":"Sau buổi này bạn dùng được: quá… đến nỗi; quá… nên không thể; đủ… để.","v":["such","enough","too much","too many","as a result"],"g":["so + adj/adv (+ that) · such + (a/an) + adj + noun (+ that)","too + adj/adv (+ to V)","adj/adv + enough (+ to V) · enough + noun"],"c":["B1U25Q1","B1U25Q2","B1U25Q3","B1U25Q5","B1U25Q4","B1U25B1","B1U25B2","B1U25B3","B1U25F1","B1U25F2","B1U25D1","B1U25S1"]}],"ex":["B1U25Q1","B1U25Q2","B1U25Q3","B1U25Q4","B1U25Q5","B1U25B1","B1U25B2","B1U25B3","B1U25F1","B1U25F2","B1U25D1","B1U25S1"]},{"n":26,"t":"Unit 26 · So sánh hơn và so sánh nhất","en":"Comparatives and superlatives","notes":[["Mục tiêu của bài","• 🎯 So sánh hai hay nhiều đối tượng bằng tính từ và trạng từ, kể cả mẫu as… as.\n• 📖 Trong sách: Unit ngữ pháp 26, trang 109–111. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Writing Task 1 là bài so sánh số liệu: gần như câu nào cũng cần higher than, the highest, twice as many as."]],"cards":[{"p":"Comparative: adj-er / more + adj + than","m":"So sánh hơn","u":"Tính từ ngắn thêm `-er` (cheaper, bigger, easier); tính từ dài dùng `more` (more expensive). Bất quy tắc: good → better, bad → worse, far → further, much/many → more, little → less.\nNhấn mức độ: much / far / a lot / slightly + so sánh hơn.","e":"Trains are cheaper than planes.\nThe figure for 2020 was much higher than that for 2010.","ev":"Tàu hỏa rẻ hơn máy bay.\nSố liệu năm 2020 cao hơn nhiều so với năm 2010.","n":"Lỗi người Việt hay mắc: Dùng cả hai cách cùng lúc: ~~more cheaper~~, ~~more better~~ → cheaper, better. Thiếu `than`.","tip":"Task 1: slightly higher than, considerably lower than, far more popular than.","vs":[]},{"p":"Superlative: the + adj-est / the most + adj","m":"So sánh nhất","u":"Luôn có `the`. Bất quy tắc: the best, the worst, the furthest, the most, the least. Sau so sánh nhất dùng `in` + nơi chốn, `of` + nhóm.","e":"This is the oldest building in the city.\nIt was the most popular activity of all.","ev":"Đây là tòa nhà cổ nhất thành phố.\nĐó là hoạt động được ưa thích nhất.","n":"Lỗi người Việt hay mắc: Quên `the`: ~~She is best student~~ → She is the best student.","tip":null,"vs":[]},{"p":"(not) as + adj/adv + as","m":"Bằng / không bằng","u":"`as… as` so sánh ngang bằng; `not as… as` = kém hơn. Gấp bao nhiêu lần: twice / three times as + adj + as.","e":"My flat is not as big as yours.\nTwice as many people chose tea as coffee.","ev":"Căn hộ của tôi không rộng bằng của bạn.\nSố người chọn trà nhiều gấp đôi số người chọn cà phê.","n":null,"tip":null,"vs":[["Comparative: adj-er / more + adj + than","A is not as expensive as B = A is cheaper than B."]]}],"words":[{"h":"slightly","m":"hơi, một chút","f":"Từ khóa của bài","e":"Prices were slightly higher in 2020.","ev":"Năm 2020 giá cao hơn một chút.","n":null},{"h":"considerably","m":"đáng kể","f":"Từ khóa của bài","e":"The city is considerably larger now.","ev":"Thành phố giờ lớn hơn đáng kể.","n":null},{"h":"twice","m":"gấp đôi, hai lần","f":"Từ khóa của bài","e":"It costs twice as much.","ev":"Nó đắt gấp đôi.","n":null},{"h":"by far","m":"hơn hẳn (+ so sánh nhất)","f":"Từ khóa của bài","e":"This is by far the best option.","ev":"Đây là lựa chọn tốt nhất, hơn hẳn các lựa chọn khác.","n":null},{"h":"the least","m":"ít nhất, kém nhất","f":"Từ khóa của bài","e":"It was the least popular choice.","ev":"Đó là lựa chọn ít được ưa thích nhất.","n":null}],"ses":[{"t":"Buổi 1 · Comparative","can":"Sau buổi này bạn dùng được: so sánh hơn; so sánh nhất; bằng / không bằng.","v":["slightly","considerably","twice","by far","the least"],"g":["Comparative: adj-er / more + adj + than","Superlative: the + adj-est / the most + adj","(not) as + adj/adv + as"],"c":["B1U26Q1","B1U26Q3","B1U26Q5","B1U26Q2","B1U26Q4","B1U26B1","B1U26B2","B1U26B3","B1U26F1","B1U26F2","B1U26D1","B1U26S1"]}],"ex":["B1U26Q1","B1U26Q2","B1U26Q3","B1U26Q4","B1U26Q5","B1U26B1","B1U26B2","B1U26B3","B1U26F1","B1U26F2","B1U26D1","B1U26S1"]},{"n":27,"t":"Unit 27 · Công việc và thu nhập","en":"Working and earning","notes":[["Mục tiêu của bài","• 🎯 Nói về nghề nghiệp, thu nhập và sự nghiệp; phân biệt job, work, career, profession và salary, wage, income.\n• 📖 Trong sách: Unit từ vựng 27, trang 112–115. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Công việc là chủ đề của Speaking Part 1 (Do you work or study?) và của nhiều đề Task 2. Task 1 hay có số liệu về thu nhập, việc làm."]],"cards":[],"words":[{"h":"ambition","m":"tham vọng, hoài bão","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"application","m":"đơn xin (việc, học)","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"bank account","m":"tài khoản ngân hàng","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"boss","m":"sếp","f":"1 · Topic vocabulary","e":null,"ev":null,"n":"Họ từ: `bossy` (tính từ)"},{"h":"career","m":"sự nghiệp","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"colleague","m":"đồng nghiệp","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"company","m":"công ty","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"contract","m":"hợp đồng","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"department","m":"phòng, ban, bộ phận","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"deserve","m":"xứng đáng","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"fame l},{"h":"come back (from)","m":"trở về","f":"2 · Phrasal verbs","e":"My sister comes back from Japan next week.","ev":"Chị tôi từ Nhật về vào tuần sau.","n":null},{"h":"come on","m":"nhanh lên nào","f":"2 · Phrasal verbs","e":"Come on, the film starts in five minutes!","ev":"Nhanh lên, năm phút nữa phim chiếu rồi!","n":null},{"h":"have on","m":"đang mặc, đang đội","f":"2 · Phrasal verbs","e":"She had on a red coat, so she was easy to see.","ev":"Cô ấy mặc áo khoác đỏ nên rất dễ thấy.","n":null},{"h":"on business","m":"đi công tác","f":"3 · Prepositional phrases","e":"My mother is in Singapore on business.","ev":"Mẹ tôi đang đi công tác ở Singapore.","n":null},{"h":"in charge (of)","m":"phụ trách","f":"3 · Prepositional phrases","e":"Ms Hoa is in charge of the sales team.","ev":"Chị Hoa phụ trách nhóm bán hàng.","n":null},{"h":"on/off duty","m":"đang trong ca trực / hết ca","f":"3 · Prepositional phrases","e":"Two nurses are on duty tonight.","ev":"Tối nay có hai y tá trực.","n":null},{"h":"on strike","m":"đang đình công","f":"3 · Prepositional phrases","e":"The bus drivers are on strike today.","ev":"Hôm nay tài xế xe buýt đình công.","n":null},{"h":"at first","m":"ban đầu","f":"3 · Prepositional phrases","e":"At first I did not like the city, but now I love it.","ev":"Ban đầu tôi không thích thành phố này, nhưng giờ thì rất thích.","n":null},{"h":"at the moment","m":"hiện tại, lúc này","f":"3 · Prepositional phrases","e":"She is not working at the moment.","ev":"Hiện tại cô ấy không đi làm.","n":null},{"h":"apply for","m":"nộp đơn xin","f":"4 · Word patterns","e":"He applied for a scholarship in Australia.","ev":"Anh ấy nộp đơn xin học bổng ở Úc.","n":null},{"h":"depend on","m":"phụ thuộc vào","f":"4 · Word patterns","e":"The price depends on the season.","ev":"Giá cả phụ thuộc vào mùa.","n":null},{"h":"difficult for","m":"khó đối với","f":"4 · Word patterns","e":"Maths is difficult for me.","ev":"Môn toán khó với tôi.","n":null},{"h":"fed up with","m":"chán ngấy","f":"4 · Word patterns","e":"I am fed up with waiting for the bus.","ev":"Tôi chán ngấy cảnh chờ xe buýt.","n":null},{"h":"inform sb about","m":"thông báo cho ai về","f":"4 · Word patterns","e":"Please inform us about any changes.","ev":"Vui lòng thông báo cho chúng tôi nếu có thay đổi.","n":null},{"h":"refer to","m":"nhắc đến, đề cập đến","f":"4 · Word patterns","e":"The writer refers to a study from 2019.","ev":"Tác giả nhắc đến một nghiên cứu năm 2019.","n":null},{"h":"responsible for","m":"chịu trách nhiệm về","f":"4 · Word patterns","e":"Who is responsible for this project?","ev":"Ai chịu trách nhiệm dự án này?","n":null},{"h":"believe in","m":"tin vào","f":"4 · Word patterns","e":"I believe in equal chances for everyone.","ev":"Tôi tin vào cơ hội bình đẳng cho mọi người.","n":null},{"h":"change sth (from sth) into","m":"đổi cái gì thành","f":"4 · Word patterns","e":"They changed the old factory into a museum.","ev":"Họ biến nhà máy cũ thành bảo tàng.","n":null},{"h":"kind to","m":"tốt bụng với","f":"4 · Word patterns","e":"She is always kind to new students.","ev":"Cô ấy luôn tốt với học sinh mới.","n":null},{"h":"a kind of","m":"một loại","f":"4 · Word patterns","e":"A mango is a kind of fruit.","ev":"Xoài là một loại quả.","n":null},{"h":"work as","m":"làm nghề","f":"4 · Word patterns","e":"He works as a nurse.","ev":"Anh ấy làm y tá.","n":null},{"h":"assist","m":"trợ giúp","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `assistant` (danh từ chỉ người), `assistance` (danh từ)"},{"h":"beg","m":"ăn xin, cầu xin","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `beggar` (danh từ chỉ người)"},{"h":"employ","m":"thuê, tuyển dụng","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `employment` (danh từ), `unemployment` (danh từ), `employer` (danh từ chỉ người), `employee` (danh từ chỉ người), `unemployed` (tính từ)"},{"h":"occupy","m":"chiếm, ở","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `occupation` (danh từ)"},{"h":"office","m":"văn phòng","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `officer` (danh từ chỉ người), `official` (tính từ), `unofficial` (dạng trái nghĩa)"},{"h":"safe","m":"an toàn","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `save` (động từ), `unsafe` (dạng trái nghĩa), `safety` (danh từ)"},{"h":"succeed","m":"thành công","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `success` (danh từ), `successful` (tính từ), `unsuccessful` (dạng trái nghĩa)"}],"ses":[{"t":"Từ chủ đề 1 · Công việc và thu nhập","can":"Sau buổi này bạn nhận ra và dùng được 15 từ chủ đề «Công việc và thu nhập», từ «ambition» đến «industry».","v":["ambition","application","bank account","boss","career","colleague","company","contract","department","deserve","fame","goal","impress","income","industry"],"g":[],"c":["B1U27M2","B1U27M4","B1U27M8","B1U27M5","B1U27M1","B1U27M6"]},{"t":"Từ chủ đề 2 · Công việc và thu nhập","can":"Sau buổi này bạn nhận ra và dùng được 14 từ chủ đề «Công việc và thu nhập», từ «interview» đến «wealthy».","v":["interview","leader","manager","pension","poverty","pressure","previous","profession","retire","salary","staff","strike","tax","wealthy"],"g":[],"c":["B1U27M7","B1U27M3","B1U27M9","B1U27M10"]},{"t":"Cụm động từ và cụm giới từ 1","can":"Sau buổi này bạn chọn đúng tiểu từ và giới từ trong các cụm cố định của Unit, không dịch từng chữ từ tiếng Việt.","v":["break in(to)","come back (from)","come on","have on","on business","in charge (of)","on/off duty","on strike","at first","at the moment"],"g":[],"c":["B1U27C1","B1U27C2","B1U27C3","B1U27C4","B1U27C5","B1U27C6","B1U27C7","B1U27C8","B1U27C9","B1U27C10","B1U27B1","B1U27B2","B1U27B3"]},{"t":"Giới từ theo sau động từ, tính từ, danh từ","can":"Sau buổi này bạn dùng đúng giới từ đi sau các động từ, tính từ và danh từ của Unit: lỗi mất điểm nhiều nhất của người Việt.","v":["apply for","depend on","difficult for","fed up with","inform sb about","refer to","responsible for","believe in","change sth (from sth) into","kind to","a kind of","work as"],"g":[],"c":["B1U27C11","B1U27C12","B1U27C13","B1U27C14","B1U27C15","B1U27C16","B1U27C17","B1U27C18","B1U27C19","B1U27C20","B1U27C21","B1U27C22"]},{"t":"Biến đổi từ loại và phần Nói","can":"Sau buổi này bạn đổi được từ gốc sang danh từ, tính từ hoặc dạng trái nghĩa, và nói được một phút về chủ đề của Unit.","v":["assist","beg","employ","occupy","office","safe","succeed"],"g":[],"c":["B1U27F1","B1U27F2","B1U27F3","B1U27F4","B1U27F5","B1U27F6","B1U27F7","B1U27D1","B1U27S1"]}],"ex":["B1U27M1","B1U27M2","B1U27M3","B1U27M4","B1U27M5","B1U27M6","B1U27M7","B1U27M8","B1U27M9","B1U27M10","B1U27C1","B1U27C2","B1U27C3","B1U27C4","B1U27C5","B1U27C6","B1U27C7","B1U27C8","B1U27C9","B1U27C10","B1U27C11","B1U27C12","B1U27C13","B1U27C14","B1U27C15","B1U27C16","B1U27C17","B1U27C18","B1U27C19","B1U27C20","B1U27C21","B1U27C22","B1U27B1","B1U27B2","B1U27B3","B1U27F1","B1U27F2","B1U27F3","B1U27F4","B1U27F5","B1U27F6","B1U27F7","B1U27D1","B1U27S1"]},{"n":28,"t":"Unit 28 · Câu điều kiện 1: loại không, loại một, loại hai","en":"Conditionals 1: (zero, first, second)","notes":[["Mục tiêu của bài","• 🎯 Nói về điều luôn đúng, điều có thể xảy ra và điều giả định ở hiện tại.\n• 📖 Trong sách: Unit ngữ pháp 28, trang 118–120. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Câu điều kiện là công cụ chính để nêu hệ quả và giải pháp trong Task 2 và Part 3: If governments invest…, If I were…"]],"cards":[{"p":"Zero conditional: if + present, present","m":"Điều luôn đúng","u":"Dùng cho sự thật và quy luật. `If` có thể thay bằng `when`.","e":"If you heat ice, it melts.\nIf people do not sleep enough, they feel tired.","ev":"Nếu làm nóng đá thì nó tan.\nNếu không ngủ đủ, người ta thấy mệt.","n":null,"tip":null,"vs":[]},{"p":"First conditional: if + present, will + V","m":"Điều có thể xảy ra ở tương lai","u":"Mệnh đề `if` dùng hiện tại đơn; mệnh đề chính dùng will / can / may / might + V. `unless` = if… not.","e":"If it rains tomorrow, we will stay at home.\nYou will not pass unless you study.","ev":"Nếu mai mưa, chúng tôi sẽ ở nhà.\nBạn sẽ không đỗ nếu không học.","n":"Lỗi người Việt hay mắc: Dùng `will` trong mệnh đề if: ~~If it will rain~~ → If it rains.","tip":"Task 2: If the government raises taxes on fuel, fewer people will drive.","vs":[]},{"p":"Second conditional: if + past simple, would + V","m":"Điều giả định, không có thật ở hiện tại","u":"Mệnh đề `if` dùng quá khứ đơn (với `be` thường dùng `were` cho mọi ngôi); mệnh đề chính dùng would / could / might + V.","e":"If I had more time, I would learn Japanese.\nIf I were you, I would apologise.","ev":"Nếu tôi có nhiều thời gian hơn, tôi sẽ học tiếng Nhật.\nNếu tôi là bạn, tôi sẽ xin lỗi.","n":"Lỗi người Việt hay mắc: Dùng `would` ở cả hai vế: ~~If I would have money, I would buy~~ → If I had money, I would buy. Quá khứ đơn ở đây không nói về quá khứ.","tip":null,"vs":[["First conditional: if + present, will + V","Loại một: người nói thấy có thể xảy ra. Loại hai: người nói thấy khó xảy ra hoặc trái thực tế."]]}],"words":[{"h":"unless","m":"trừ khi, nếu không","f":"Từ khóa của bài","e":"I will not go unless you come.","ev":"Tôi sẽ không đi trừ khi bạn đi cùng.","n":null},{"h":"as long as","m":"miễn là","f":"Từ khóa của bài","e":"You can stay as long as you are quiet.","ev":"Bạn có thể ở lại miễn là giữ yên lặng.","n":null},{"h":"provided that","m":"với điều kiện là","f":"Từ khóa của bài","e":"We will go provided that it is sunny.","ev":"Chúng tôi sẽ đi với điều kiện trời nắng.","n":null},{"h":"in case","m":"phòng khi","f":"Từ khóa của bài","e":"Take an umbrella in case it rains.","ev":"Mang ô đi phòng khi trời mưa.","n":null},{"h":"otherwise","m":"nếu không thì","f":"Từ khóa của bài","e":"Hurry up, otherwise we will be late.","ev":"Nhanh lên, nếu không chúng ta sẽ muộn.","n":null}],"ses":[{"t":"Buổi 1 · Zero conditional", 3` = đã có thể; `might have + V3` = có lẽ đã.","e":"If you had asked me, I could have helped.\nIf it had not rained, more people might have come.","ev":"Nếu bạn hỏi thì tôi đã có thể giúp.\nNếu trời không mưa thì có lẽ nhiều người đã đến hơn.","n":null,"tip":null,"vs":[]}],"words":[{"h":"luckily","m":"may thay","f":"Từ khóa của bài","e":"Luckily, nobody was hurt.","ev":"May thay không ai bị thương.","n":null},{"h":"miss","m":"lỡ (tàu, cơ hội)","f":"Từ khóa của bài","e":"I missed the last bus.","ev":"Tôi lỡ chuyến xe buýt cuối.","n":null},{"h":"realise","m":"nhận ra","f":"Từ khóa của bài","e":"I did not realise it was so late.","ev":"Tôi không nhận ra đã muộn thế.","n":null},{"h":"opportunity","m":"cơ hội","f":"Từ khóa của bài","e":"It was a great opportunity.","ev":"Đó là một cơ hội tuyệt vời.","n":null},{"h":"turn out","m":"hóa ra, rốt cuộc là","f":"Từ khóa của bài","e":"Everything turned out fine.","ev":"Mọi việc rốt cuộc ổn cả.","n":null}],"ses":[{"t":"Buổi 1 · Third conditional","can":"Sau buổi này bạn dùng được: giả định trái với quá khứ; kết quả có thể đã khác.","v":["luckily","miss","realise","opportunity","turn out"],"g":["Third conditional: if + past perfect, would have + V3","could have / might have in the result clause"],"c":["B1U29Q1","B1U29Q2","B1U29Q3","B1U29Q5","B1U29Q4","B1U29B1","B1U29B2","B1U29B3","B1U29F1","B1U29F2","B1U29D1","B1U29S1"]}],"ex":["B1U29Q1","B1U29Q2","B1U29Q3","B1U29Q4","B1U29Q5","B1U29B1","B1U29B2","B1U29B3","B1U29F1","B1U29F2","B1U29D1","B1U29S1"]},{"n":30,"t":"Unit 30 · Cơ thể và lối sống","en":"Body and lifestyle","notes":[["Mục tiêu của bài","• 🎯 Nói về sức khỏe, ăn uống và lối sống; phân biệt affect và effect, cure và treat.\n• 📖 Trong sách: Unit từ vựng 30, trang 124–127. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Sức khỏe và lối sống là chủ đề thường gặp ở cả bốn bs","e":"It took her a month to get over the flu.","ev":"Cô ấy mất một tháng mới khỏi cúm.","n":null},{"h":"put off","m":"hoãn lại","f":"2 · Phrasal verbs","e":"They put off the meeting until Monday.","ev":"Họ hoãn cuộc họp đến thứ Hai.","n":null},{"h":"in addition (to)","m":"ngoài ra, thêm vào","f":"3 · Prepositional phrases","e":"In addition to English, she speaks French.","ev":"Ngoài tiếng Anh, cô ấy còn nói tiếng Pháp.","n":null},{"h":"in comparison to/with","m":"so với","f":"3 · Prepositional phrases","e":"The city is quiet in comparison with Hanoi.","ev":"Thành phố này yên tĩnh so với Hà Nội.","n":null},{"h":"on a diet","m":"đang ăn kiêng","f":"3 · Prepositional phrases","e":"I am on a diet, so no cake for me.","ev":"Tôi đang ăn kiêng nên không ăn bánh đâu.","n":null},{"h":"at risk","m":"có nguy cơ gặp nguy hiểm","f":"3 · Prepositional phrases","e":"Old people are more at risk in very hot weather.","ev":"Người già dễ gặp nguy hiểm hơn khi trời rất nóng.","n":null},{"h":"in shape","m":"có thể lực tốt","f":"3 · Prepositional phrases","e":"Cycling to work keeps me in shape.","ev":"Đạp xe đi làm giúp tôi giữ thể lực.","n":null},{"h":"at night","m":"vào ban đêm","f":"3 · Prepositional phrases","e":"The streets are very quiet at night.","ev":"Ban đêm đường phố rất yên tĩnh.","n":null},{"h":"addicted to","m":"nghiện","f":"4 · Word patterns","e":"Many teenagers are addicted to their phones.","ev":"Nhiều thanh thiếu niên nghiện điện thoại.","n":null},{"h":"allergic to","m":"dị ứng với","f":"4 · Word patterns","e":"She is allergic to seafood.","ev":"Cô ấy dị ứng hải sản.","n":null},{"h":"combine sth with","m":"kết hợp cái gì với","f":"4 · Word patterns","e":"She combines work with study.","ev":"Cô ấy vừa làm vừa học.","n":null},{"h":"continue with","m":"tiếp tục với","f":"4 · Word patterns","e":"Please continue with your work.","ev":"Mời tiếp tục công việc của bạn.","n":null},{"h":"covered in/with","m":"phủ đầy","f":"4 · Word patterns","e":"The mountains were covered wi c: Tiếng Việt không lùi thì nên dễ viết ~~She said she is tired~~. Đại từ cũng phải đổi theo người nói.","tip":null,"vs":[]},{"p":"say vs tell","m":"say (something) · tell + người + (something)","u":"`say` không có tân ngữ chỉ người đi liền sau (say to me that…); `tell` luôn cần người nghe (tell me that…).","e":"She said that she was busy.\nShe told me that she was busy.","ev":"Cô ấy nói cô ấy bận.\nCô ấy bảo tôi là cô ấy bận.","n":"Lỗi người Việt hay mắc: ~~She said me~~, ~~She told that~~ → She told me, She said that.","tip":null,"vs":[]},{"p":"Time and place changes","m":"Đổi từ chỉ thời gian, nơi chốn","u":"now → then · today → that day · yesterday → the day before · tomorrow → the next day · last week → the week before · here → there · this → that.","e":"\"I saw him yesterday.\" → She said she had seen him the day before.\n\"We are leaving tomorrow.\" → They said they were leaving the next day.","ev":"Cô ấy nói đã gặp anh ta hôm trước.\nHọ nói hôm sau sẽ đi.","n":null,"tip":null,"vs":[]}],"words":[{"h":"claim","m":"khẳng định (chưa chắc đúng)","f":"Từ khóa của bài","e":"He claimed that he was innocent.","ev":"Anh ta khẳng định mình vô tội.","n":null},{"h":"explain","m":"giải thích","f":"Từ khóa của bài","e":"She explained that the train was late.","ev":"Cô ấy giải thích là tàu trễ.","n":null},{"h":"mention","m":"nhắc đến","f":"Từ khóa của bài","e":"He mentioned that he was moving.","ev":"Anh ấy có nhắc là sắp chuyển nhà.","n":null},{"h":"according to","m":"theo (nguồn tin)","f":"Từ khóa của bài","e":"According to the report, prices will rise.","ev":"Theo báo cáo, giá sẽ tăng.","n":null},{"h":"the following day","m":"ngày hôm sau","f":"Từ khóa của bài","e":"They left the following day.","ev":"Hôm sau họ rời đi.","n":null}],"ses":[{"t":"Buổi 1 · say / tell + (that) + clause with backshift","can":"Sau buổi này bạn dùng được: thuật lại câu kể, lùi một thì; say (something) · tell + người + (something); đổi từ chỉ thời gian, nơi chốn.","v":["claim","explain","mention","according to","the following day"],"g":["say / tell + (that) + clause with backshift","say vs tell","Time and place changes"],"c":["B1U31Q1","B1U31Q2","B1U31Q4","B1U31Q3","B1U31Q5","B1U31B1","B1U31B2","B1U31B3","B1U31F1","B1U31F2","B1U31D1","B1U31S1"]}],"ex":["B1U31Q1","B1U31Q2","B1U31Q3","B1U31Q4","B1U31Q5","B1U31B1","B1U31B2","B1U31B3","B1U31F1","B1U31F2","B1U31D1","B1U31S1"]},{"n":32,"t":"Unit 32 · Tường thuật câu hỏi, mệnh lệnh, lời đề nghị","en":"Reported questions, orders, requests","notes":[["Mục tiêu của bài","• 🎯 Thuật lại câu hỏi và lời yêu cầu của người khác đúng trật tự từ.\n• 📖 Trong sách: Unit ngữ pháp 32, trang 133–135. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Kể lại một cuộc trò chuyện trong Part 2 cần các mẫu asked me if…, told me to…"]],"cards":[{"p":"Reported yes/no questions: asked + if/whether + clause","m":"Thuật lại câu hỏi Yes/No","u":"Dùng `if` hoặc `whether`, trật tự như câu kể, lùi thì, không có dấu hỏi.","e":"\"Do you like tea?\" → She asked if I liked tea.\n\"Have you eaten?\" → He asked whether I had eaten.","ev":"Cô ấy hỏi tôi có thích trà không.\nAnh ấy hỏi tôi đã ăn chưa.","n":"Lỗi người Việt hay mắc: Giữ trật tự câu hỏi: ~~She asked did I like tea~~ → She asked if I liked tea.","tip":null,"vs":[]},{"p":"Reported wh- questions: asked + wh-word + clause","m":"Thuật lại câu hỏi có từ hỏi","u":"Giữ từ hỏi, sau đó là chủ ngữ + động từ (không đảo), lùi thì.","e":"\"Where do you live?\" → He asked where I lived.\n\"What time is it?\" → She asked what time it was.","ev":"Anh ấy hỏi tôi sống ở đâu.\nCô ấy hỏi mấy giờ rồi.","n":"Lỗi người Việt hay mắc: ~~He asked where did I live~~, ~~She asked what time was it~~ → where I lived, what time it was.","tip":null,"vs":[]},{"p":"Reported orders and requests: told/asked + người + (not) to V","m":"Thuật lại mệnh lệnh, lời nhờ","u": ":"ở đằng xa","f":"3 · Prepositional phrases","e":"We could see mountains in the distance.","ev":"Chúng tôi thấy núi ở đằng xa.","n":null},{"h":"in total","m":"tổng cộng","f":"3 · Prepositional phrases","e":"In total, 300 people took part in the survey.","ev":"Tổng cộng có 300 người tham gia khảo sát.","n":null},{"h":"at most","m":"nhiều nhất là","f":"3 · Prepositional phrases","e":"The trip takes two hours at most.","ev":"Chuyến đi mất nhiều nhất là hai tiếng.","n":null},{"h":"aware of","m":"nhận thức được","f":"4 · Word patterns","e":"Few people are aware of the problem.","ev":"Ít người nhận thức được vấn đề này.","n":null},{"h":"damage to","m":"thiệt hại đối với","f":"4 · Word patterns","e":"The flood caused serious damage to roads.","ev":"Trận lũ gây thiệt hại nặng cho đường sá.","n":null},{"h":"escape from","m":"trốn thoát khỏi","f":"4 · Word patterns","e":"Two animals escaped from the zoo.","ev":"Hai con vật trốn khỏi sở thú.","n":null},{"h":"help (sb) with","m":"giúp (ai) việc gì","f":"4 · Word patterns","e":"Can you help me with my homework?","ev":"Bạn giúp tôi làm bài tập được không?","n":null},{"h":"prevent sb from","m":"ngăn ai làm gì","f":"4 · Word patterns","e":"The rain prevented us from going out.","ev":"Cơn mưa khiến chúng tôi không ra ngoài được.","n":null},{"h":"save sth from","m":"cứu cái gì khỏi","f":"4 · Word patterns","e":"Volunteers saved the turtles from danger.","ev":"Các tình nguyện viên cứu đàn rùa khỏi nguy hiểm.","n":null},{"h":"serious about","m":"nghiêm túc về","f":"4 · Word patterns","e":"She is serious about becoming a nurse.","ev":"Cô ấy nghiêm túc với việc trở thành y tá.","n":null},{"h":"afraid of","m":"sợ","f":"4 · Word patterns","e":"My little brother is afraid of dogs.","ev":"Em trai tôi sợ chó.","n":null},{"h":"care about","m":"quan tâm đến","f":"4 · Word patterns","e":"Young people care about the environment.","ev":"Giới trẻ quan tâm đến môi trường.","n":null},{"h":"enthusiastic about","m":"hào hứng với","f":"4 · Word patterns","e":"The class is enthusiastic about the new project.","ev":"Cả lớp hào hứng với dự án mới.","n":null},{"h":"happen to","m":"xảy ra với","f":"4 · Word patterns","e":"What happened to your phone?","ev":"Điện thoại của bạn bị làm sao thế?","n":null},{"h":"worry about","m":"lo lắng về","f":"4 · Word patterns","e":"Do not worry about the test.","ev":"Đừng lo về bài kiểm tra.","n":null},{"h":"danger","m":"mối nguy hiểm","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `dangerous` (tính từ)"},{"h":"deep","m":"sâu","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `deeply` (trạng từ), `depth` (danh từ)"},{"h":"destroy","m":"phá hủy","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `destruction` (danh từ), `destructive` (tính từ)"},{"h":"fog","m":"sương mù","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `foggy` (tính từ)"},{"h":"garden","m":"khu vườn","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `gardener` (danh từ chỉ người), `gardening` (danh từ)"},{"h":"nature","m":"thiên nhiên","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `natural` (tính từ), `naturally` (trạng từ)"},{"h":"pollute","m":"gây ô nhiễm","f":"5 · Word formation","e":null,"ev":null,"n":"Họ từ: `pollution` (danh từ), `polluted` (tính từ)"}],"ses":[{"t":"Từ chủ đề 1 · Thiên nhiên và môi trường","can":"Sau buổi này bạn nhận ra và dùng được 15 từ chủ đề «Thiên nhiên và môi trường», từ «amazing» đến «mammal».","v":["amazing","climate","countryside","environment","extinct","forecast","freezing","global","heatwave","insect","lightning","litter","local","locate","mammal"],"g":[],"c":["B1U36M3","B1U36M1","B1U36M2"]},{"t":"Từ chủ đề 2 · Thiên nhiên và môi trường","can":"Sau buổi này bạn nhận ra và dùng được 15 từ chủ đề «Thiên nhiên và môi trường», từ «mild» đến «wildlife».","v":["mild","name","origin","planet","preserve","recycle","reptile","rescue","satellite","shower","solar system","species","thunder","wild","wildlife"],"g":[],"c":["B1U36M4","B1U36M9","B1U36M7", êu của bài","• 🎯 Biết động từ nào theo sau là V-ing, động từ nào là to V, và những động từ đổi nghĩa.\n• 📖 Trong sách: Unit ngữ pháp 37, trang 154–156. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Lỗi sau động từ (enjoy to do, want doing) rất dễ bị nghe thấy trong Speaking và làm giảm độ chính xác ngữ pháp."]],"cards":[{"p":"verb + -ing","m":"Động từ + V-ing","u":"enjoy, finish, avoid, mind, suggest, practise, keep, consider, imagine, miss, risk, give up, feel like, can't stand. Sau giới từ cũng dùng V-ing: interested in learning, good at cooking. V-ing có thể làm chủ ngữ: Swimming is good for you.","e":"I enjoy cooking at weekends.\nShe is good at solving problems.","ev":"Tôi thích nấu ăn vào cuối tuần.\nCô ấy giỏi giải quyết vấn đề.","n":"Lỗi người Việt hay mắc: ~~I enjoy to cook~~, ~~interested to learn~~ → enjoy cooking, interested in learning. Tiếng Việt không đổi dạng động từ nên phải học theo từng động từ.","tip":"Mở câu Task 2 bằng chủ ngữ V-ing: Learning a language takes time.","vs":[]},{"p":"verb + to + infinitive","m":"Động từ + to V","u":"want, decide, hope, plan, agree, refuse, promise, offer, learn, manage, need, expect, afford, seem, would like. Với tân ngữ: want / ask / tell / advise / allow / encourage + người + to V.","e":"We decided to move to the city.\nMy parents want me to study medicine.","ev":"Chúng tôi quyết định chuyển lên thành phố.\nBố mẹ muốn tôi học y.","n":"Lỗi người Việt hay mắc: ~~want that I study~~ → want me to study. ~~decided moving~~ → decided to move.","tip":null,"vs":[]},{"p":"verbs that change meaning (stop, remember, forget, try)","m":"Động từ đổi nghĩa theo dạng theo sau","u":"stop + V-ing = ngừng việc đang làm / stop + to V = dừng lại để làm việc khác. remember + V-ing = nhớ là đã làm / remember + to V = nhớ phải làm. try + V-ing = thử xem sao / try + to V = cố gắng.","e":"He stopped smoking last year.\nRemember to lock the door.","ev":"Anh ấy bỏ thuốc năm ngoái.\nNhớ khóa cửa nhé.","n":null,"tip":null,"vs":[]},{"p":"make / let + person + V","m":"make / let + người + động từ nguyên mẫu không to","u":"`make` = bắt, khiến; `let` = cho phép. Ở bị động: be made to V, be allowed to V.","e":"My boss made me work late.\nHer parents let her stay out late.","ev":"Sếp bắt tôi làm muộn.\nBố mẹ cho cô ấy đi chơi về muộn.","n":"Lỗi người Việt hay mắc: ~~made me to work~~, ~~let her to stay~~ → made me work, let her stay.","tip":null,"vs":[]}],"words":[{"h":"avoid","m":"tránh","f":"Từ khóa của bài","e":"I avoid eating late.","ev":"Tôi tránh ăn khuya.","n":null},{"h":"afford","m":"có đủ tiền","f":"Từ khóa của bài","e":"We cannot afford to buy a house.","ev":"Chúng tôi không đủ tiền mua nhà.","n":null},{"h":"refuse","m":"từ chối","f":"Từ khóa của bài","e":"He refused to help.","ev":"Anh ấy từ chối giúp.","n":null},{"h":"suggest","m":"gợi ý","f":"Từ khóa của bài","e":"She suggested going by train.","ev":"Cô ấy gợi ý đi tàu.","n":null},{"h":"look forward to","m":"mong chờ (+ V-ing)","f":"Từ khóa của bài","e":"I look forward to hearing from you.","ev":"Tôi mong nhận được hồi âm của bạn.","n":null},{"h":"be used to","m":"quen với (+ V-ing)","f":"Từ khóa của bài","e":"I am used to getting up early.","ev":"Tôi quen dậy sớm rồi.","n":null}],"ses":[{"t":"Buổi 1 · verb + -ing","can":"Sau buổi này bạn dùng được: động từ + v-ing; động từ + to v.","v":["avoid","afford","refuse","suggest","look forward to","be used to"],"g":["verb + -ing","verb + to + infinitive"],"c":["B1U37Q1","B1U37Q3","B1U37Q6","B1U37Q2"]},{"t":"Buổi 2 · verbs that change meaning (stop, remember, forget, try)","can":"Sau buổi này bạn dùng được: động từ đổi nghĩa theo dạng theo sau; make / let + người + động từ nguyên mẫu không to.","v":[],"g":["verbs that change meaning (stop, remember, forget, try)","make / let + person + V"],"c":["B1U37Q5","B1U37Q4","B1U37B1","B1U37B2","B1U37B3" ve coffee.\" \"So do I.\"\n\"I cannot swim.\" \"Neither can I.\"","ev":"\"Tôi thích cà phê.\" \"Tôi cũng vậy.\"\n\"Tôi không biết bơi.\" \"Tôi cũng không.\"","n":"Lỗi người Việt hay mắc: ~~So I do~~, ~~Neither I can~~ → So do I, Neither can I (phải đảo). Cách đơn giản: Me too / Me neither.","tip":null,"vs":[]}],"words":[{"h":"both","m":"cả hai","f":"Từ khóa của bài","e":"Both films were good.","ev":"Cả hai bộ phim đều hay.","n":null},{"h":"either","m":"một trong hai; cũng (không)","f":"Từ khóa của bài","e":"You can take either road.","ev":"Bạn đi đường nào cũng được.","n":null},{"h":"neither","m":"không cái nào trong hai","f":"Từ khóa của bài","e":"Neither option is cheap.","ev":"Không lựa chọn nào rẻ cả.","n":null},{"h":"as well","m":"cũng (cuối câu)","f":"Từ khóa của bài","e":"I speak French as well.","ev":"Tôi cũng nói tiếng Pháp.","n":null},{"h":"too","m":"cũng (cuối câu khẳng định)","f":"Từ khóa của bài","e":"She is tired, and I am too.","ev":"Cô ấy mệt và tôi cũng vậy.","n":null}],"ses":[{"t":"Buổi 1 · both … and / either … or / neither … nor","can":"Sau buổi này bạn dùng được: cả hai / hoặc… hoặc / không… cũng không; trong hai cái này; tôi cũng vậy / tôi cũng không.","v":["both","either","neither","as well","too"],"g":["both … and / either … or / neither … nor","both of / either of / neither of + the/these/my + plural noun","So + auxiliary + subject / Neither (Nor) + auxiliary + subject"],"c":["B1U38Q1","B1U38Q2","B1U38Q5","B1U38Q3","B1U38Q4","B1U38B1","B1U38B2","B1U38B3","B1U38F1","B1U38F2","B1U38D1","B1U38S1"]}],"ex":["B1U38Q1","B1U38Q2","B1U38Q3","B1U38Q4","B1U38Q5","B1U38B1","B1U38B2","B1U38B3","B1U38F1","B1U38F2","B1U38D1","B1U38S1"]},{"n":39,"t":"Unit 39 · Cảm xúc và tính cách","en":"Laughing and crying","notes":[["Mục tiêu của bài","• 🎯 Nói về cảm xúc và cách cư xử; phân biệt tính từ đuôi -ed và -ing (embarrassed / embarrassing).\n• 📖 Trong sách: Unit từ vựng 39, trang 160–163. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằn Dù trời mưa, chúng tôi vẫn ra ngoài.\nBất chấp trời mưa, chúng tôi vẫn ra ngoài.","n":"Lỗi người Việt hay mắc: Dùng cả hai từ như tiếng Việt \"mặc dù… nhưng\": ~~Although it rained, but we went~~ → bỏ `but`. ~~Despite it rained~~ → Despite the rain. ~~despite of~~ → despite.","tip":"Câu nhượng bộ trong Task 2: Although technology has many benefits, it also creates problems.","vs":[]},{"p":"however / on the other hand","m":"Tuy nhiên (đứng đầu câu mới, có dấu phẩy)","u":"`however` nối hai câu riêng: trước nó là dấu chấm hoặc chấm phẩy, sau nó là dấu phẩy. Không dùng như `but` giữa hai mệnh đề bằng dấu phẩy.","e":"The flat is small. However, it is very bright.\nCars are convenient; however, they pollute the air.","ev":"Căn hộ nhỏ. Tuy nhiên, nó rất sáng.\nÔ tô tiện lợi; tuy nhiên, chúng gây ô nhiễm không khí.","n":"Lỗi người Việt hay mắc: ~~The flat is small, however it is bright~~ (lỗi nối câu bằng dấu phẩy).","tip":null,"vs":[["although / even though + clause · despite / in spite of + noun/-ing","`although` nối trong một câu; `however` mở một câu mới."]]},{"p":"because / so / so that / in order to","m":"Lý do, kết quả, mục đích","u":"`because` + mệnh đề (lý do); `because of` + danh từ; `so` + kết quả; `so that` + mệnh đề và `in order to` / `to` + V (mục đích).","e":"We stayed in because of the storm.\nShe saves money so that she can travel.","ev":"Chúng tôi ở nhà vì bão.\nCô ấy tiết kiệm tiền để có thể đi du lịch.","n":"Lỗi người Việt hay mắc: ~~Because it rained, so we stayed~~ → bỏ `so` (không dùng cặp \"vì… nên\"). ~~because of it rained~~ → because it rained.","tip":null,"vs":[]}],"words":[{"h":"although","m":"mặc dù (+ mệnh đề)","f":"Từ khóa của bài","e":"Although he is rich, he is not happy.","ev":"Dù giàu, anh ấy không hạnh phúc.","n":null},{"h":"despite","m":"bất chấp (+ danh từ/V-ing)","f":"Từ khóa của bài","e":"Despite the cost, we bought it.","ev":"Dù đắt, chúng tôi vẫn mua.","n":null},{"h":"however","m":"tuy nhiên","f":"Từ khóa của bài","e":"It was cold. However, we enjoyed the trip.","ev":"Trời lạnh. Tuy nhiên, chúng tôi vẫn thích chuyến đi.","n":null},{"h":"therefore","m":"do đó","f":"Từ khóa của bài","e":"He was ill. Therefore, he stayed at home.","ev":"Anh ấy ốm. Do đó anh ấy ở nhà.","n":null},{"h":"whereas","m":"trong khi (đối lập)","f":"Từ khóa của bài","e":"I like tea, whereas my wife likes coffee.","ev":"Tôi thích trà, còn vợ tôi thích cà phê.","n":null},{"h":"in order to","m":"để (mục đích)","f":"Từ khóa của bài","e":"He left early in order to catch the train.","ev":"Anh ấy đi sớm để kịp tàu.","n":null}],"ses":[{"t":"Buổi 1 · Time clauses","can":"Sau buổi này bạn dùng được: mệnh đề thời gian nói về tương lai dùng hiện tại; tương phản: mặc dù.","v":["although","despite","however","therefore","whereas","in order to"],"g":["Time clauses: when / as soon as / before / after / until / while + present","although / even though + clause · despite / in spite of + noun/-ing"],"c":["B1U40Q1","B1U40Q2","B1U40Q3"]},{"t":"Buổi 2 · however / on the other hand","can":"Sau buổi này bạn dùng được: tuy nhiên (đứng đầu câu mới, có dấu phẩy); lý do, kết quả, mục đích.","v":[],"g":["however / on the other hand","because / so / so that / in order to"],"c":["B1U40Q4","B1U40Q5","B1U40Q6","B1U40B1","B1U40B2","B1U40B3","B1U40F1","B1U40F2","B1U40D1","B1U40S1"]}],"ex":["B1U40Q1","B1U40Q2","B1U40Q3","B1U40Q4","B1U40Q5","B1U40Q6","B1U40B1","B1U40B2","B1U40B3","B1U40F1","B1U40F2","B1U40D1","B1U40S1"]},{"n":41,"t":"Unit 41 · Thể sai khiến: have/get something done","en":"The causative","notes":[["Mục tiêu của bài","• 🎯 Nói về việc mình nhờ hoặc thuê người khác làm.\n• 📖 Trong sách: Unit ngữ pháp 41, trang 169–171. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Dùng tự nhiên trong Speaking Part 1 và Part 2 khi nói về dịch vụ hằng ngày: have my hair cut, get my phone repaired."]],"cards":[{"p":"have + object + V3","m":"Nhờ, thuê người khác làm việc gì","u":"Chủ ngữ không tự làm mà sắp xếp cho người khác làm. `have` chia theo thì: I had / am having / will have / have had…","e":"I had my hair cut yesterday.\nWe are having the house painted next week.","ev":"Hôm qua tôi đi cắt tóc.\nTuần sau chúng tôi cho sơn nhà.","n":"Lỗi người Việt hay mắc: Tiếng Việt nói \"tôi cắt tóc\" cho cả hai trường hợp nên dễ viết ~~I cut my hair yesterday~~ (nghĩa là tự cắt). Sai trật tự: ~~I had cut my hair~~ (thành quá khứ hoàn thành) → I had my hair cut.","tip":null,"vs":[["be + V3 (present and past simple passive)","Bị động nói việc được làm; causative nói rõ ai là người sắp xếp cho việc đó được làm."]]},{"p":"get + object + V3","m":"Giống have + object + V3, thân mật hơn","u":"Thường dùng trong văn nói.","e":"I need to get my phone fixed.\nWhere did you get your photos printed?","ev":"Tôi cần mang điện thoại đi sửa.\nBạn in ảnh ở đâu thế?","n":null,"tip":null,"vs":[]},{"p":"have + object + V3 (something bad happens)","m":"Bị ai đó làm điều không mong muốn","u":"Cùng cấu trúc nhưng chỉ việc xấu xảy ra với mình.","e":"She had her bag stolen on the bus.\nHe had his car damaged in the storm.","ev":"Cô ấy bị móc túi trên xe buýt.\nXe anh ấy bị hư hại trong cơn bão.","n":null,"tip":null,"vs":[]}],"words":[{"h":"repair","m":"sửa chữa","f":"Từ khóa của bài","e":"I had my watch repaired.","ev":"Tôi mang đồng hồ đi sửa.","n":null},{"h":"deliver","m":"giao","f":"Từ khóa của bài","e":"We had a pizza delivered.","ev":"Chúng tôi gọi pizza giao tận nhà.","n":null},{"h":"check","m":"kiểm tra","f":"Từ khóa của bài","e":"You should have your eyes checked.","ev":"Bạn nên đi kiểm tra mắt.","n":null},{"h":"install","m":"lắp đặt","f":"Từ khóa của bài","e":"They had a new kitchen installed.","ev":"Họ cho lắp bếp mới.","n":null},{"h":"service","m":"bảo dưỡng (xe, máy)","f":"Từ khóa của bài","e":"I have my motorbike serviced every six months.","ev":"Sáu tháng tôi cho bảo dưỡng xe máy một lần.","n":null}],"ses":[{"t":"Buổi 1 · have + object + V3","can":"Sau buổi này bạn dùng được: nhờ, thuê người khác làm việc gì; giống have + object + v3, thân mật hơn; bị ai đó làm điều không mong muốn.","v":["repair","deliver","check","install","service"],"g":["have + object + V3","get + object + V3","have + object + V3 (something bad happens)"],"c":["B1U41Q1","B1U41Q2","B1U41Q3","B1U41Q5","B1U41Q4","B1U41B1","B1U41B2","B1U41B3","B1U41F1","B1U41F2","B1U41D1","B1U41S1"]}],"ex":["B1U41Q1","B1U41Q2","B1U41Q3","B1U41Q4","B1U41Q5","B1U41B1","B1U41B2","B1U41B3","B1U41F1","B1U41F2","B1U41D1","B1U41S1"]},{"n":42,"t":"Unit 42 · Vấn đề và giải pháp","en":"Problems and solutions","notes":[["Mục tiêu của bài","• 🎯 Nêu vấn đề, nguyên nhân và giải pháp; dùng đúng các động từ tường thuật (claim, deny, warn, encourage).\n• 📖 Trong sách: Unit từ vựng 42, trang 172–175. Học thẻ ở đây trước, rồi làm các bài tập của Unit trong sách và tự chấm bằng đáp án cuối sách.\n• 🗣️ Kết thúc bằng phần Nói: tự nói, ghi âm, nghe lại, sửa một lỗi rồi nói lần hai."],["Dùng ở đâu trong IELTS","Đây là bộ từ của dạng đề Task 2 \"nguyên nhân – giải pháp\" và của mọi câu hỏi Part 3 dạng What can be done about…?"]],"cards":[],"words":[{"h":"accident","m":"tai nạn; sự tình cờ","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"assume","m":"cho rằng, mặc định là","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"cause","m":"(v) gây ra; (n) nguyên nhân","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"claim","m":"khẳng định, tuyên bố (chưa chắc đúng)","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"complain","m":"phàn nàn","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"convince","m":"thuyết phục (ai tin điều gì)","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"criticise","m":"chỉ trích, phê bình","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null},{"h":"deny","m":"phủ nhận","f":"1 · Topic vocabulary","e":null,"ev":null,"n":null} ree and fast. I ring my parents twice a week, and we talk on the phone for about half an hour. I read the news on the internet rather than on TV. At work I use formal language in emails, but with friends my messages are very informal. I think the media has changed the way we communicate.","plan":[["1 phút chuẩn bị","Ghi ý bằng từ khóa nối nhau bằng mũi tên (ít nhất ba mũi tên), không viết cả câu."],["0–15 giây","Trả lời thẳng vào câu hỏi bằng một câu."],["15–45 giây","Nêu lý do hoặc chi tiết, rồi một ví dụ của chính bạn."],["45–60 giây","Kết lại bằng một câu về cảm nghĩ hoặc dự định."]]},"B1U22S1":{"k":"s","en":"Talk about a decision you regret.","vi":"Hãy nói về một quyết định bạn hối tiếc.","model":"When I was at university, I chose a subject I did not like. I should have asked my teachers for advice, but I did not. I could have changed my course in the first year, and I think I would have been happier. My parents must have known I was not enjoying it. Looking back, I shouldn't have been afraid to tell them.","plan":[["1 phút chuẩn bị","Ghi ý bằng từ khóa nối nhau bằng mũi tên (ít nhất ba mũi tên), không viết cả câu."],["0–15 giây","Trả lời thẳng vào câu hỏi bằng một câu."],["15–45 giây","Nêu lý do hoặc chi tiết, rồi một ví dụ của chính bạn."],["45–60 giây","Kết lại bằng một câu về cảm nghĩ hoặc dự định."]]},"B1U23S1":{"k":"s","en":"Ask me three questions about my job, then answer one yourself.","vi":"Hãy hỏi tôi ba câu về công việc của tôi, rồi tự trả lời một câu về bạn.","model":"What do you do? How long have you worked there? Could you tell me what you like most about your job? As for me, I work in a bank. I have worked there for two years, and I like it because my colleagues are friendly.","plan":[["1 phút chuẩn bị","Ghi ý bằng từ khóa nối nhau bằng mũi tên (ít nhất ba mũi tên), không viết cả câu."],["0–15 giây","Trả lời thẳng vào câu hỏi bằng một câu."],["15–45 giây","Nêu lý do hoặc chi tiết, rồi một ví dụ của chính bạn."],["45–60 giây","Kết lại bằng một câu 2S1":{"k":"s","en":"Describe a job interview or an interview you have had.","vi":"Hãy kể về một buổi phỏng vấn bạn từng tham gia.","model":"Last year I had an interview at a bank. The manager asked me why I wanted the job and whether I had any experience. She also asked where I had studied. Then she told me to wait outside for a few minutes. Finally, she asked me to start the following Monday, and she reminded me not to forget my documents.","plan":[["1 phút chuẩn bị","Ghi ý bằng từ khóa nối nhau bằng mũi tên (ít nhất ba mũi tên), không viết cả câu."],["0–15 giây","Trả lời thẳng vào câu hỏi bằng một câu."],["15–45 giây","Nêu lý do hoặc chi tiết, rồi một ví dụ của chính bạn."],["45–60 giây","Kết lại bằng một câu về cảm nghĩ hoặc dự định."]]},"B1U33S1":{"k":"s","en":"Describe a piece of clothing or an object you like.","vi":"Hãy tả một món quần áo hoặc đồ vật bạn thích.","model":"My favourite piece of clothing is a cotton shirt that my sister gave me. It has a simple striped pattern, and the material is very smooth. It is a little loose, which is practical in hot weather. The style suits me, and the colour matches most of my trousers. I noticed a small tear last month, so I had it fixed.","plan":[["1 phút chuẩn bị","Ghi ý bằng từ khóa nối nhau bằng mũi tên (ít nhất ba mũi tên), không viết cả câu."],["0–15 giây","Trả lời thẳng vào câu hỏi bằng một câu."],["15–45 giây","Nêu lý do hoặc chi tiết, rồi một ví dụ của chính bạn."],["45–60 giây","Kết lại bằng một câu về cảm nghĩ hoặc dự định."]]},"B1U34S1":{"k":"s","en":"Describe a present you gave someone.","vi":"Hãy kể về một món quà bạn đã tặng ai đó.","model":"Last year I gave my mother a scarf for her birthday. I bought it for her at a small shop in the old town. The shop assistant showed me several colours and offered me a discount. I also wrote a card to her. When I gave it to her, she was very happy, and she still wears it.","plan":[["1 phút chuẩn bị","Ghi ý bằng từ khóa nối nhau bằng mũi tên (ít nhất ba mũi tên), khôn . I have decided to learn the guitar this year, and I hope to play a few songs by summer. My sister suggested taking online lessons, so I am looking forward to starting next week.","plan":[["1 phút chuẩn bị","Ghi ý bằng từ khóa nối nhau bằng mũi tên (ít nhất ba mũi tên), không viết cả câu."],["0–15 giây","Trả lời thẳng vào câu hỏi bằng một câu."],["15–45 giây","Nêu lý do hoặc chi tiết, rồi một ví dụ của chính bạn."],["45–60 giây","Kết lại bằng một câu về cảm nghĩ hoặc dự định."]]},"B1U38S1":{"k":"s","en":"Tell me about two people in your family. How are they similar?","vi":"Hãy kể về hai người trong gia đình bạn. Họ giống nhau ở điểm nào?","model":"I will talk about my mother and my aunt. Both of them are teachers, and both my mother and my aunt love cooking. Neither of them likes spicy food. My mother gets up very early, and so does my aunt. However, neither my mother nor my aunt can swim, and neither can I.","plan":[["1 phút chuẩn bị","Ghi ý bằng từ khóa nối nhau bằng mũi tên (ít nhất ba mũi tên), không viết cả câu."],["0–15 giây","Trả lời thẳng vào câu hỏi bằng một câu."],["15–45 giây","Nêu lý do hoặc chi tiết, rồi một ví dụ của chính bạn."],["45–60 giây","Kết lại bằng một câu về cảm nghĩ hoặc dự định."]]},"B1U39S1":{"k":"s","en":"Describe a time when you felt very happy or very embarrassed.","vi":"Hãy kể về một lần bạn rất vui hoặc rất ngượng.","model":"I remember an embarrassing moment at my friend's wedding. I was asked to tell a joke, but nobody laughed. I felt miserable for a few minutes. Luckily, my friend has a good sense of humour, and she reacted in a very calm way. In the end, everyone was in a good mood, and we celebrated until midnight. Now I find the story amusing.","plan":[["1 phút chuẩn bị","Ghi ý bằng từ khóa nối nhau bằng mũi tên (ít nhất ba mũi tên), không viết cả câu."],["0–15 giây","Trả lời thẳng vào câu hỏi bằng một câu."],["15–45 giây","Nêu lý do hoặc chi tiết, rồi một ví dụ của chính bạn."],["45–60 giây","Kết lại bằng một câu về cảm nghĩ ho eaper bus tickets. This would have a positive result for everyone.","plan":[["1 phút chuẩn bị","Ghi ý bằng từ khóa nối nhau bằng mũi tên (ít nhất ba mũi tên), không viết cả câu."],["0–15 giây","Trả lời thẳng vào câu hỏi bằng một câu."],["15–45 giây","Nêu lý do hoặc chi tiết, rồi một ví dụ của chính bạn."],["45–60 giây","Kết lại bằng một câu về cảm nghĩ hoặc dự định."]]}}};
const $=s=>document.querySelector(s),app=$('#app');
let P={};try{P=JSON.parse(localStorage.getItem('haru-b1')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('haru-b1',JSON.stringify(P))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function md(s){if(!s)return'';const out=[];let rows=[];const flush=()=>{if(rows.length){out.push('<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${inline(c)}</td>`:`<th>${inline(c)}</th>`).join('')+'</tr>').join('')+'</table>');rows=[]}};
for(const ln of s.split('\n')){if(ln.trim().startsWith('|')){rows.push(ln.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()))}else{flush();out.push('<p style="margin:6px 0">'+inline(ln)+'</p>')}}flush();return out.join('')}
function say(text,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate||0.9;const v=speechSynthesis.getVoices().find(v=>/^en[-_]GB/.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
const prog=L=>{const n=L.ex.filter(i=>P[i]).length;return[n,L.ex.length]};
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();

function home(){const tot=D.lessons.reduce((a,L)=>a+prog(L)[0],0),all=D.lessons.reduce((a,L)=>a+L.ex.length,0);
app.innerHTML=`<h1>Destination B1 · Lấy gốc</h1><p class="mute">42 Unit · ${all} bài tập · đã làm đúng ${tot}. Tiến độ lưu trên trình duyệt này.</p>
<div class="card"><h3>Cách học một Unit</h3><p style="margin:4px 0">1. Học thẻ từng buổi (khoảng 15 phút) rồi làm câu kiểm tra của buổi. 2. Mở sách, làm bài tập của Unit, tự chấm. 3. Nghe chép và nói; ghi âm bằng máy của bạn, nghe lại, nói lần hai.</p></div>`+
D.lessons.map(L=>{const[n,t]=prog(L);return`<button class="unit" data-u="${L.n}"><span><b>${esc(L.t)}</b><span class="mute">${esc(L.en)}</span><span class="bar"><i style="width:${t?n/t*100:0}%"></i></span></span><span class="pill">${L.cards.length?'Ngữ pháp':'Từ vựng'} · ${n}/${t}</span></button>`}).join('');
app.querySelectorAll('.unit').forEach(b=>b.onclick=()=>{location.hash='u'+b.dataset.u})}

function cardHtml(c){const ex=(c.e||'').split('\n'),ev=(c.ev||'').split('\n');
return`<details><summary>${esc(c.p)}</summary><p style="margin:4px 0"><b>${inline(c.m)}</b></p>${md(c.u)}${ex.filter(Boolean).map((e,i)=>`<div class="ex">${esc(e)} <button class="say" data-say="${esc(e)}">🔊</button><small>${esc(ev[i]||'')}</small></div>`).join('')}${c.n?`<div class="note">${inline(c.n)}</div>`:''}${c.tip?`<div class="tip"><b>IELTS:</b> ${inline(c.tip)}</div>`:''}${c.vs.map(v=>`<div class="tip"><b>So với ${esc(v[0])}:</b> ${inline(v[1])}</div>`).join('')}</details>`}
function wordHtml(w){return`<div class="word"><span><b>${esc(w.h)}</b> <span class="mute">${inline(w.m)}</span>${w.e?`<br><span>${esc(w.e)}</span><br><span class="mute">${esc(w.ev||'')}</span>`:''}${w.n?`<br><span class="mute">${inline(w.n)}</span>`:''}</span><button class="say" data-say="${esc(w.e||w.h.replace(/\(.*?\)|\bsb\b|\bsth\b/g,''))}">🔊</button></div>`}

function unit(n){const L=D.lessons.find(l=>l.n==n);if(!L)return home();const[dn,dt]=prog(L);
app.innerHTML=`<div class="top row"><button class="btn ghost" id="back">← Danh sách</button><span class="pill">${dn}/${dt} câu đúng</span></div><h1>${esc(L.t)}</h1><p class="mute">${esc(L.en)}</p>`+
L.notes.map(x=>`<div class="card"><h3>${esc(x[0]||'')}</h3>${md(x[1])}</div>`).join('')+
L.ses.map((s,i)=>{const cards=L.cards.filter(c=>s.g.includes(c.p)),words=L.words.filter(w=>s.v.includes(w.h)),done=s.c.filter(id=>P[id]).length;
return`<h2>${esc(s.t)}</h2><p class="mute">${esc(s.can)}</p><div class="card">${cards.map(cardHtml).join('')}${words.length?`<details ${cards.length?'':'open'}><summary>${words.length} từ và cụm</summary>${words.map(wordHtml).join('')}</details>`:''}</div><button class="btn" data-run="${i}">Kiểm tra buổi này · ${done}/${s.c.length}</button>`}).join('')+
`<h2>Luyện cả Unit</h2><div class="row"><button class="btn ghost" data-run="all">Tất cả ${L.ex.length} câu</button><button class="btn ghost" data-run="todo">Chỉ câu chưa đúng</button></div>`;
$('#back').onclick=()=>{location.hash=''};
app.querySelectorAll('[data-say]').forEach(b=>b.onclick=e=>{e.preventDefault();say(b.dataset.say)});
app.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{const k=b.dataset.run;let ids=k=='all'?L.ex:k=='todo'?L.ex.filter(i=>!P[i]):L.ses[k].c;if(!ids.length)ids=L.ex;run(L,ids.slice(),0,0)})}

function run(L,ids,i,right){if(i>=ids.length){app.innerHTML=`<div class="card"><h1>Xong ${ids.length} câu</h1><p>Đúng ngay lần đầu: ${right}/${ids.length}.</p><div class="row"><button class="btn" id="b1">Về Unit</button></div></div>`;$('#b1').onclick=()=>unit(L.n);return}
const id=ids[i],e=D.ex[id];let scored=false;
const head=`<div class="top row"><button class="btn ghost" id="quit">← Unit ${L.n}</button><span class="pill">${i+1}/${ids.length}</span></div>`;
const next=ok=>{if(!scored){scored=true;if(ok){P[id]=1;save();right++}}};
const foot=()=>{const b=document.createElement('button');b.className='btn';b.textContent=i+1<ids.length?'Câu tiếp →':'Kết thúc';b.onclick=()=>run(L,ids,i+1,right);app.appendChild(b);b.scrollIntoView({block:'nearest'})};
const fb=(ok,html)=>{const d=document.createElement('div');d.className='fb '+(ok?'ok':'bad');d.innerHTML=(ok?'<b>Đúng.</b> ':'<b>Chưa đúng.</b> ')+html;app.appendChild(d)};
if(e.k=='m'){app.innerHTML=head+`<div class="q">${inline(e.q)}</div>`+e.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('');
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(scored)return;const j=+b.dataset.j,ok=j==e.a;next(ok);app.querySelectorAll('.opt')[e.a].classList.add('ok');if(!ok)b.classList.add('bad');fb(ok,inline(e.w));foot()})}
else if(e.k=='b'){let pick=[];app.innerHTML=head+`<p class="mute">Xếp thành câu có nghĩa:</p><div class="q">${esc(e.vi)}</div><div class="line row" id="line"></div><div class="row" id="tiles"></div><p><button class="btn" id="chk">Kiểm tra</button> <button class="btn ghost" id="clr">Xếp lại</button></p>`;
const draw=()=>{$('#line').innerHTML=pick.map(j=>`<span class="tile">${esc(e.t[j])}</span>`).join('');$('#tiles').innerHTML=e.t.map((t,j)=>`<button class="tile ${pick.includes(j)?'used':''}" data-j="${j}">${esc(t)}</button>`).join('');$('#tiles').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(!pick.includes(j)&&!scored){pick.push(j);draw()}})};draw();
$('#clr').onclick=()=>{if(!scored){pick=[];draw()}};$('#chk').onclick=()=>{if(scored)return;const got=pick.map(j=>e.t[j]).join(' '),ok=e.ans.includes(got);next(ok);fb(ok,`<span>${esc(e.ans[0])}</span> <button class="say" id="sy">🔊</button>`);$('#sy').onclick=()=>say(e.ans[0]);foot()}}
else if(e.k=='f'){app.innerHTML=head+`<div class="q">${inline(e.q)}</div><input type="text" id="in" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Gõ đáp án"><p><button class="btn" id="chk">Kiểm tra</button></p>`;
$('#chk').onclick=()=>{if(scored)return;const ok=e.acc.some(a=>norm(a)==norm($('#in').value));next(ok);fb(ok,`Đáp án: <b>${esc(e.acc.join(' / '))}</b>. ${inline(e.w)}`);foot()}}
else if(e.k=='d'){app.innerHTML=head+`<p class="mute">Nghe rồi gõ lại từng câu. Bấm loa để nghe; giọng đọc là giọng máy của thiết bị.</p>`+e.t.map((t,j)=>`<div class="card"><div class="row"><button class="btn ghost" data-p="${j}">🔊 Câu ${j+1}</button><button class="btn ghost" data-s="${j}">🐢 Chậm</button></div><p><input type="text" data-in="${j}" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Gõ câu bạn nghe được"></p><div data-o="${j}"></div></div>`).join('')+`<p><button class="btn" id="chk">Kiểm tra</button></p>`;
app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>say(e.t[b.dataset.p][0],0.95));app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>say(e.t[b.dataset.s][0],0.6));
$('#chk').onclick=()=>{if(scored)return;let all=true;e.t.forEach((t,j)=>{const ok=norm(t[0])==norm(app.querySelector(`[data-in="${j}"]`).value);all=all&&ok;app.querySelector(`[data-o="${j}"]`).innerHTML=`<div class="fb ${ok?'ok':'bad'}">${esc(t[0])}<br><span class="mute">${esc(t[1])}</span></div>`});next(all);foot()}}
else{let left=60,tm=null;app.innerHTML=head+`<p class="mute">Nói · 1 phút chuẩn bị, 1 phút nói</p><div class="q">${esc(e.en)}</div><p class="mute">${esc(e.vi||'')}</p><div class="card">${e.plan.map(p=>`<p style="margin:4px 0"><b>${esc(p[0])}:</b> ${esc(p[1])}</p>`).join('')}</div><textarea id="nt" rows="3" placeholder="Ghi ý bằng từ khóa và mũi tên, không viết cả câu"></textarea><p class="row"><button class="btn" id="go">Bắt đầu 60 giây</button><span class="timer" id="tm">1:00</span></p><p class="mute">Trang này không ghi âm được. Hãy mở ứng dụng ghi âm của máy, nói, nghe lại, chọn một lỗi để sửa rồi nói lần hai.</p><details><summary>Xem bài mẫu sau khi đã tự nói</summary><p>${esc(e.model)}</p><button class="btn ghost" id="sm">🔊 Nghe bài mẫu</button></details><p><button class="btn ghost" id="dn">Tôi đã nói hai lần</button></p>`;
$('#go').onclick=()=>{clearInterval(tm);left=60;tm=setInterval(()=>{left--;$('#tm')&&($('#tm').textContent='0:'+String(Math.max(left,0)).padStart(2,'0'));if(left<=0||!$('#tm'))clearInterval(tm)},1000)};
$('#sm').onclick=()=>say(e.model,0.9);$('#dn').onclick=()=>{if(scored)return;next(true);foot()}}
$('#quit').onclick=()=>{try{speechSynthesis.cancel()}catch(x){}unit(L.n)};window.scrollTo(0,0)}

function route(){const m=location.hash.match(/^#u(\d+)$/);m?unit(+m[1]):home();window.scrollTo(0,0)}
addEventListener('hashchange',route);try{speechSynthesis.getVoices()}catch(e){}route();
</script>
</body>
</html>
