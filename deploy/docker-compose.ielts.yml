# Haru English (IELTS) on the shared GCP VM alongside Haru (Korean).
# Isolated stack: own project name (haru-ielts), own network, own volumes, own database (haru_ielts).
#
#   /opt/haru-ielts/.env.prod     secrets (mode 600; never in git)
#   /opt/haru-ielts/compose.env   POSTGRES_PASSWORD and HARU_IELTS_DOMAIN (mode 600)
#   /opt/haru-ielts/src           DuTi2201/haru-ielts checkout
name: haru-ielts

x-runtime: &runtime
  env_file:
    - ../../.env.prod
  environment:
    DATABASE_URL: postgresql+asyncpg://haru_ielts:${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}@db:5432/haru_ielts
    REDIS_URL: redis://redis:6379/0
    BACKUP_GCS_PREFIX: backup-ielts
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: haru_ielts
      POSTGRES_DB: haru_ielts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=96MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haru_ielts -d haru_ielts"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 350m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:8.2
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 48mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    <<: *runtime
    image: haru-ielts-backend:local
    build:
      context: ../
      dockerfile: Dockerfile
    command: >
      sh -c "umask 000 && rm -f /run/haru-mcp/ielts-api.sock &&
      exec uvicorn app.main:app --uds /run/haru-mcp/ielts-api.sock"
    volumes:
      - /opt/haru/mcp:/run/haru-mcp
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket, http.client; c = http.client.HTTPConnection('localhost'); c.sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM); c.sock.settimeout(4); c.sock.connect('/run/haru-mcp/ielts-api.sock'); c.request('GET', '/healthz'); r = c.getresponse(); assert r.status == 200",
        ]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    mem_limit: 400m

  worker:
    <<: *runtime
    image: haru-ielts-backend:local
    pull_policy: never
    command: >
      env MALLOC_ARENA_MAX=2 MALLOC_MMAP_THRESHOLD_=131072 MALLOC_TRIM_THRESHOLD_=131072
      celery -A app.core.celery_app worker --loglevel=info --concurrency=1
      --max-memory-per-child=180000 --max-tasks-per-child=50 -B
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 500m

volumes:
  pgdata:
  redisdata:
